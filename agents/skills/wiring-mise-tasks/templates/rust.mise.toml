# <repo> — mise task runner。未完成の TEMPLATE fragment: そのまま実行用に配らない。
# 文法と動詞契約の正本は
# wiring-mise-tasks/SKILL.md。コピー時に検証済みの runtime を [tools] に宣言する。
# Rust の package/feature/test 範囲は writing-rust RG5 で決める。
# この初期形は一つの Cargo workspace と default features を対象にする。
# 検査: bun ~/.claude/skills/wiring-mise-tasks/scripts/mise-contract.ts

# setup は Cargo だけで依存を解決できる場合に免除できる。native 前提があれば追加する。
# setup の免除は [tools] 宣言を免除しない。
# ↓ は生きている免除宣言 (可視の免除が無言の欠落に勝る。消せば WARN に戻る):
# mise-contract: waive setup -- cargo resolves deps at build

[tasks.fmt]
alias = "f"
description = "Rust source を rustfmt で整形"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "整形チェック (CI用・非破壊)"
run = "cargo fmt --all -- --check"

# 恒久設定は Cargo.toml の [workspace.lints.clippy] 表が本筋 — 裁定は
# wiring-mise-tasks/references/recipes.md §2。表を導入したら -D warnings を落とす。
[tasks.lint]
alias = "l"
description = "clippy 静的解析 (workspace 全 member/target、default features)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
alias = "t"
description = "workspace 全 member の test と doctest (default features)"
run = "cargo test --workspace"

# 別 workspace、simulation、feature 組合せは必要な test:* と lint:* を追加して集約する。
# nextest を使う場合は同じ package/feature 範囲の cargo test --doc も配線する。

# cargo 標準の update は Cargo.lock しか触らない → cargo-edit (cargo upgrade) で
# Cargo.toml の要求 version 自体を上げる。破壊は後段の check が捕える運用。
[tasks.up]
alias = "u"
description = "依存を最新へ一括更新 (要求を最新 major へ + lock 同期)。実行後は mise run check"
run = '''
command -v cargo-upgrade >/dev/null 2>&1 || cargo install cargo-edit
cargo upgrade --incompatible allow
cargo update
'''

[tasks."up:check"]
description = "依存更新の dry-run (書き換えず候補を一覧)"
run = '''
command -v cargo-upgrade >/dev/null 2>&1 || cargo install cargo-edit
cargo upgrade --incompatible allow --dry-run
'''

[tasks.check]
alias = "c"
description = "全gate集約: fmt:check + lint + test"
depends = ["fmt:check", "lint", "test"]

[tasks."mise:contract"]
description = "筋肉記憶トークン契約の検査 (wiring-mise-tasks gate)。mise.toml 編集後に実行"
run = "bun ~/.claude/skills/wiring-mise-tasks/scripts/mise-contract.ts"

# git の各 hook で何が走るかはここで宣言する。.githooks/<event> は `mise run --jobs 1 hook:<event>`
# だけを実行する shim(形 = wiring-repositories HOOK-1、mise の実行上の注意 = wiring-mise-tasks
# recipes.md §8)。gate の task は契約 verb の depends のみで、run 本体を持たない。
[tasks."hook:pre-commit"]
description = "commit gate — .githooks/pre-commit が走らせるものそのもの。契約 verb の depends のみ"
depends = ["fmt:check", "lint"]

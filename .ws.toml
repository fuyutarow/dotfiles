# Read by ws (tools/jj-ws; spec: tools/spec/jj-ws.md). `ready` runs, in order, inside each
# new workspace; `trunk` is the revset a change must be reachable from to count as landed.
ready = ["mise trust -q", "bun install --frozen-lockfile"]
trunk = "alpha"
# agx ws gc reads this list; only rebuildable tool caches belong here, never worker results.
regenerable = [".rumdl_cache/"]

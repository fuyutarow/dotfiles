# oxlint-policy — the ONE home of this repo's TypeScript lint policy. `.oxlintrc.json` is GENERATED
# from it by scripts/render-oxlintrc.ts (`mise run oxlint:render`); `mise run lint:oxlint-policy`
# fails when the two differ, and tests/oxlint-policy.test.ts proves every custom rule fires on its
# `bad` snippet and stays silent on its `good` one.
#
# No implicit default (owner, 2026-10-05: 「妥協なくstrict」): the plugins and every category level
# are stated here. In the four quality categories every rule is an error unless it is listed under
# [[off]] with the failure-or-cost reason it was judged on; restriction rules are opt-in, one by one,
# under [[on]]. There is no warn level (a warning nobody must fix trains people to read past it),
# no `overrides` and no disable comment (lint:ts-ratchet, lint:ts-no-disable).
#
# Every key is required where its table appears; the renderer's schema is strict, so a typo or an
# unknown rule name fails the render (oxlint itself also rejects an unknown rule).

schema = 1

# oxlint's default plugin set, named so it cannot change under us on an upgrade.
plugins = ["eslint", "typescript", "unicorn", "oxc"]

# Loads ESLint's core rules into oxlint, for `no-restricted-syntax` (the [[custom]] kind "syntax").
js_plugins = [{ name = "eslint-js", specifier = "oxlint-plugin-eslint" }, { name = "dotfiles", specifier = "./tools/oxlint-plugin-dotfiles/src/index.mjs" }]

[bun_api]
# Test fixtures are outside Bun API migration scope; other lint rules still apply to them.
exclude = ["**/tests/**", "**/*.test.ts"]
apis = [
  { modules = ["node:fs", "fs"], api = "readFileSync", replacement = "await Bun.file(p).text() / .arrayBuffer()" },
  { modules = ["node:fs", "fs"], api = "existsSync", replacement = "await Bun.file(p).exists()" },
  { modules = ["node:fs", "fs"], api = "statSync", replacement = "await fs.promises.stat(p)" },
  { modules = ["node:fs", "fs"], api = "lstatSync", replacement = "await fs.promises.lstat(p)" },
  { modules = ["node:fs", "fs"], api = "readdirSync", replacement = "await fs.promises.readdir(p)" },
  { modules = ["node:child_process", "child_process"], api = "exec", replacement = "Bun.spawn" },
  { modules = ["node:child_process", "child_process"], api = "execFile", replacement = "Bun.spawn" },
  { modules = ["node:child_process", "child_process"], api = "spawn", replacement = "Bun.spawn" },
  { modules = ["node:child_process", "child_process"], api = "execSync", replacement = "Bun.spawn / Bun.spawnSync" },
  { modules = ["node:child_process", "child_process"], api = "execFileSync", replacement = "Bun.spawn / Bun.spawnSync" },
  { modules = ["node:child_process", "child_process"], api = "spawnSync", replacement = "Bun.spawn / Bun.spawnSync" },
  { modules = ["node:crypto", "crypto"], api = "createHash", replacement = "Bun.CryptoHasher" },
]

# Production exemptions are per-file only. Every entry must still call a policy API; stale entries fail lint.
# Membership is compared with the parent revision by lint:oxlint-policy (initial rollout excepted).
# Paths resolve against the plugin's checkout, so consumer repos never inherit these exemptions.

# CocoIndex Code — global settings (dotfiles-managed).
# Symlinked to ~/.cocoindex_code/global_settings.yml by scripts/link-dots.sh,
# so `ccc init` is NOT needed on a fresh machine. After editing, run `ccc doctor`.
#
# Local SentenceTransformers embeddings — fully offline, no API key (the [full] install).
#
# Model history (measured — see agents/skills/driving-cocoindex/references/catalog.md):
#   2026-07-13  Snowflake/snowflake-arctic-embed-xs → ibm-granite/granite-embedding-97m-multilingual-r2
#     Why: arctic's topical signal is EN-only (Japanese queries were topic-blind); granite-97m-r2
#     is ccc's own curated Multi-Lingual tier, code score 0.80 > arctic's 0.67, same dim (384).
#   2026-07-17  granite-97m-multilingual-r2 → granite-311m-multilingual-r2  (dim 384 → 768)
#     Why: house JA-notes+code A/B pilot — 311m-r2 beat 97m-r2 on both halves (notes and code),
#     total nDCG@10 +70%; ruri-v3-70m won notes but lost code, unfit as ccc's single global model.
#
# On any model change, run `ccc reset --force && ccc index` in EVERY registered project (the
# daemon auto-restarts on the next call). granite-r2 defines an empty "query" prompt, so the
# query_params below stays valid.

embedding:
  provider: sentence-transformers
  model: ibm-granite/granite-embedding-311m-multilingual-r2
  indexing_params: {}
  query_params:
    prompt_name: query

# To use a cloud embedding provider via LiteLLM instead, set `provider`/`model`
# above and inject keys here. DO NOT commit real secrets — keep keys in the
# machine's environment and reference them, or keep this block commented.
# envs:
#   OPENAI_API_KEY: ...
#   VOYAGE_API_KEY: ...

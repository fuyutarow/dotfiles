# systemd user services and `systemd-run --user` do not read shell startup files.
# Both standard Linux Homebrew prefixes are listed because environment.d cannot read the
# rendered prefix file. A prefix directory that does not exist is harmless on PATH.
# This filename must sort after 99-environment.conf, which replaces PATH.
PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:${HOME}/.linuxbrew/bin:${HOME}/.linuxbrew/sbin:${HOME}/.local/bin:${HOME}/.bun/bin:${PATH}

# jj/config.toml — dotfiles-managed USER config for Jujutsu, shared by every repo on the machine.
# Linked to ~/.config/jj/config.toml by scripts/link-dots.sh (jj reads $XDG_CONFIG_HOME or
# ~/.config on Linux AND macOS). Edit here, never the linked copy.
#
# Repo-level config (`jj config set --repo`) is NOT in the repo: jj 0.45 keeps it under
# ~/.config/jj/repos/<hash>/, outside every checkout and outside this repo, so a value set there
# is lost on a new machine. Put cross-project values here; use --repo only for a value that is
# genuinely specific to one repo, and say why where it is set.

[user]
# Same identity as git/gitconfig — a colocated repo's commits are written by jj, not git.
name = "fuyutarow"
email = "fuyutarow@gmail.com"

[revset-aliases]
# House default branch is alpha (CLAUDE.md → Git), and jj's built-in trunk() only looks for
# main/master/trunk. A repo whose trunk differs overrides this one alias with --repo.
"trunk()" = "alpha@origin"

[snapshot]
# Default 1MiB silently leaves larger new files untracked (only a stderr warning), and a commit
# then drops them from history; jj-commit.ts refuses such a snapshot, this makes it rare.
max-new-file-size = "16MiB"

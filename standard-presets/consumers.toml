# Owner declarations received 2026-10-16. Gates run only in an export of committed trunk.
# checked counts consumers selected by changed surface, including copy/setup failures.
# Omitted trunk uses the consumer repository's own trunk() revset.
[[consumers]]
name = "retrospectives"
root = "~/Workspace/retrospectives"
trunk = "alpha"
surfaces = ["package-bins"]
bins = ["mise-contract"]
# dx land owns acceptance; only mise-contract remains shared.
command = ["mise-contract"]
timeout_ms = 120000

[[consumers]]
name = "firedancer"
root = "~/Workspace/firedancer"
trunk = "alpha"
surfaces = ["standard-presets/typescript"]
setup = ["bun", "install", "--frozen-lockfile"]
# Consumers lint their owned configuration; compare preset drift explicitly.
command = ["mise", "run", "lint:ts"]
timeout_ms = 120000

[[consumers]]
name = "agx"
root = "~/Workspace/agx"
trunk = "alpha"
surfaces = ["standard-presets/typescript"]
setup = ["bun", "install", "--frozen-lockfile"]
# Run agx's TypeScript lint tasks without its full formatting and test suite.
command = ["sh", "-c", "mise run lint:ts && mise run lint:all && mise run lint:knip"]
timeout_ms = 180000



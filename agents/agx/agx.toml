schema = 1

[route]
allow = ["codex"]
on_window_exhausted = { codex = "continue", claude = "stop" }
default = "luna-high"
exclude = ["luna-max", "terra-max", "sol-max", "astra-max"]
max_task_chars = 6000
timeout_ms = 20000
no_egress = []
# No feedback loop: sampling adds noise; 0 picks Jev's most probable row (mode=argmax).
pick_temperature = 0

[route.jev]
api = "typesafe"
url = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"

[claude_run]
max_budget_usd = 2.0
max_turns = 60
reason = "A worker task here cost 0.05-0.20 USD on luna; 20x is 1-4 USD, so 2 USD caps a run near the median at claude prices and turns an endless loop into a bounded failure."

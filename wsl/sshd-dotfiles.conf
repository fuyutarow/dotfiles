# sshd drop-in for the WSL guest — linked to /etc/ssh/sshd_config.d/50-dotfiles.conf by
# scripts/link-dots.sh (guarded sudo, like wsl.conf and sysctl.conf). Takes effect on
# `sudo systemctl reload ssh`.
#
# StreamLocalBindUnlink: ssh/config forwards the client's smart-open receiver to
# /tmp/smart-open-$USER--<alias>.sock here. When a connection drops, that socket file stays behind, and with
# the default (no) sshd refuses to bind over it — the next attach silently loses the forward and
# `o <url>` opens on Windows again. `yes` removes the old file before binding, so the newest
# connection — the screen you just attached from — owns it. smart-open/smart-open.ts also removes a
# socket nobody listens on, so this is the fast path, not the only one.
StreamLocalBindUnlink yes


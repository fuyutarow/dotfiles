[categories]
correctness = "error"
suspicious = "error"
pedantic = "error"
perf = "error"
restriction = "off" # opt-in rules only: see [[on]]
style = "off"       # formatting is oxfmt's; naming style is not a failure
nursery = "off"     # unstable rules

[[ignore]]
pattern = "node_modules"
reason = "third-party code"

[[ignore]]
pattern = "archives"
reason = "retired skills kept as reference, not maintained code"

[[ignore]]
pattern = "agents/claude/hooks/repo-retrieve.ts"
reason = "a symlink oxlint resolves at the link path; the real file (tools/repo-retrieve/src/repo-retrieve.ts) is linted"

[[ignore]]
pattern = "agents/skills/writing-typescript/assets/consumer-repo"
reason = "material copied INTO another repo (zod.ts imports zod the way a consumer repo must); that repo lints its copy under the house rules, and tests/consumer-repo.test.ts pins its behaviour to dotfiles' own agents/hooks/zod.ts"

[[ignore]]
pattern = "agents/hooks/vendor"
reason = "generated dependency bundle (scripts/vendor-deps.ts)"

# --- quality-category rules judged OFF (counts measured 2026-10-05, oxlint 1.82.0) ---------------

[[off]]
rule = "typescript/prefer-readonly-parameter-types"
reason = "1109 hits. Requires DEEPLY readonly parameter types, which mutable library classes (Response, Subprocess, Bun.Glob) cannot satisfy, and disable comments are banned; revisit with a measured `allow` list."

[[off]]
rule = "eslint/max-lines-per-function"
reason = "274 hits. A length threshold names no failure; nesting is limited by max-depth and size is a review judgment."

[[off]]
rule = "eslint/max-lines"
reason = "70 hits. A file-length threshold names no failure."

[[off]]
rule = "eslint/max-classes-per-file"
reason = "2 hits. A count threshold names no failure."

[[off]]
rule = "eslint/no-inline-comments"
reason = "224 hits. The house style puts the reason for a constant or a branch on its own line."

[[off]]
rule = "eslint/no-await-in-loop"
reason = "141 hits. The mechanical fix (Promise.all) runs deliberately serial work concurrently, which breaks resource admission (orchestrating-agents P7) and rate limits."

[[off]]
rule = "eslint/no-underscore-dangle"
reason = "54 hits. Style: `_` marks intentionally unused bindings and foreign API names (`__proto__` guards)."

[[off]]
rule = "eslint/no-negated-condition"
reason = "45 hits. Style; no failure prevented."

[[off]]
rule = "unicorn/no-negated-condition"
reason = "45 hits. Style; no failure prevented (same as the eslint rule)."

[[off]]
rule = "eslint/sort-vars"
reason = "8 hits. Style; no failure prevented."

[[off]]
rule = "eslint/no-redeclare"
reason = "3 hits, all the house pattern of a zod schema and its type sharing one name (`const Row = z…; type Row = z.output<typeof Row>`); tsc already rejects a real redeclaration."

[[off]]
rule = "eslint/require-await"
reason = "Duplicate of typescript/require-await, which is type-aware and stays on."

[[off]]
rule = "unicorn/require-module-specifiers"
reason = "Flags `export {}`, the idiom that makes a script a module so its top-level names stay file-scoped; its autofix removed it from scripts/tests/fake-codex.ts and two fixtures then redeclared each other (observed 2026-10-05)."

# --- options: a rule on by category, with its setting stated -------------------------------------

[[option]]
rule = "unicorn/no-useless-undefined"
value = { checkArguments = false, checkArrowFunctionBody = true }
reason = "An explicit `undefined` ARGUMENT is not useless under TypeScript: a required `T | undefined` parameter needs it (the autofix dropped such arguments and broke 60+ calls, observed 2026-10-05). `return undefined` and `= undefined` stay errors."

[[option]]
rule = "eslint/max-depth"
value = 2
reason = "Nesting beyond two blocks hides the control flow; flatten with early returns, lookup tables or a named helper."

[[option]]
rule = "typescript/strict-boolean-expressions"
value = { allowString = false, allowNumber = false, allowNullableObject = false, allowNullableBoolean = false, allowNullableString = false, allowNullableNumber = false, allowAny = false }
reason = "No implicit truthiness: an empty string, 0 and null/undefined are different cases and each is tested explicitly."

# --- restriction rules turned ON one by one -------------------------------------------------------

[[on]]
rule = "typescript/no-explicit-any"
reason = "`any` switches type checking off at the trust boundary; parse with zod instead."

# --- custom bans: each carries its message and bad/good snippets the test lints -------------------
# Every snippet is linted on its own: each `bad` must fire, each `good` must stay silent. A `good`
# should be the NEAREST legal neighbour of a `bad` (the exemption's edge), not unrelated code — a
# silent unrelated file proves nothing about how narrow the rule is.
# kind: global -> no-restricted-globals · syntax -> eslint-js/no-restricted-syntax (ESTree selector)
#       import-path / import-pattern -> no-restricted-imports paths / patterns

[[custom]]
id = "no-date"
scope = "house"
kind = "global"
target = "Date"
since = "2026-10-03"
message = "Date is banned: use Temporal (bun >= 1.4 ships it; mise.toml pins bun \"1.4\"; `mise run doctor` bun-floor guards the runtime)."
bad = ["export const t = Date.now();\n"]
good = ["export const t = Temporal.Now.instant();\n"]

[[custom]]
id = "no-switch"
scope = "house"
kind = "syntax"
target = "SwitchStatement"
since = "2026-10-03"
message = "switch is banned: ts-pattern's match(..).exhaustive() where the file may import it, else an if/else chain or a lookup table."
bad = ["export function f(x: number): number {\n  switch (x) {\n    case 1:\n      return 1;\n    default:\n      return 0;\n  }\n}\n"]
good = ["export function f(x: number): number {\n  return x === 1 ? 1 : 0;\n}\n"]

[[custom]]
id = "no-nested-ternary"
scope = "house"
kind = "syntax"
target = "ConditionalExpression ConditionalExpression"
since = "2026-10-03"
message = "nested ternaries are banned: one level max; beyond that ts-pattern's match(), an if/else chain, or early returns."
bad = ["export const f = (a: boolean, b: boolean): number => (a ? (b ? 1 : 2) : 3);\n"]
good = ["export const f = (a: boolean): number => (a ? 1 : 3);\n"]

[[custom]]
id = "no-try"
scope = "house"
kind = "syntax"
target = "TryStatement"
since = "2026-10-03"
message = "try is banned (catch AND finally): errors as values — neverthrow's fromThrowable/fromAsyncThrowable where the file may import it, else agents/hooks/attempt.ts (Promise.try, zero-dep), or Promise.try(fn).then(ok, err) inline in a self-contained skill; cleanup via using / await using / DisposableStack, or promise.finally()."
bad = ["declare function g(): void;\nexport function f(): void {\n  try {\n    g();\n  } finally {\n    g();\n  }\n}\n"]
good = ["declare function g(): void;\nexport function f(): void {\n  g();\n}\n"]

[[custom]]
id = "no-throw"
scope = "house"
kind = "syntax"
target = "ThrowStatement"
since = "2026-10-06"
message = "throw is banned: no-try left nothing to catch it, so a throw is a crash path no type shows. Return the failure as a value — neverthrow's err()/errAsync() and Result where the file may import it, else a tagged union like agents/hooks/attempt.ts's Attempt; the entry point matches the result, prints the message and calls process.exit(code). Code that throws (a library, JSON.parse) is wrapped once with fromThrowable/attempt."
bad = ["export function f(x: number): number {\n  if (x < 0) throw new Error(\"negative\");\n  return x;\n}\n"]
good = ["import { err, ok, type Result } from \"neverthrow\";\nexport function f(x: number): Result<number, string> {\n  return x < 0 ? err(\"negative\") : ok(x);\n}\n"]

[[custom]]
id = "no-promise-reject"
scope = "house"
kind = "syntax"
target = "CallExpression[callee.object.name='Promise'][callee.property.name='reject']"
since = "2026-10-06"
message = "Promise.reject is a throw by another name (no-throw): return errAsync()/a ResultAsync, or an Attempt-style tagged union."
bad = ["export const f = (): Promise<never> => Promise.reject(new Error(\"no\"));\n"]
good = ["import { errAsync, type ResultAsync } from \"neverthrow\";\nexport const f = (): ResultAsync<never, string> => errAsync(\"no\");\n"]

[[custom]]
id = "no-stdin-listener"
scope = "house"
kind = "syntax"
target = "CallExpression[callee.object.object.name='process'][callee.object.property.name='stdin'][callee.property.name=/^(on|once|addListener|prependListener|prependOnceListener)$/]"
since = "2026-10-06"
message = "a listener on process.stdin keeps the process alive after it has its answer: reclaim-purge printed '✅ purge 完了' and then hung (2026-10-06). Read one line with prompt() (null on EOF), all of stdin with Bun.stdin.text() (hooks: readStdinJson)."
bad = ["process.stdin.once(\"data\", (d: Buffer) => {\n  void d;\n});\nexport {};\n"]
good = ["export const answer = prompt(\"continue?\") ?? \"\";\n"]

[[custom]]
id = "no-type-predicate"
scope = "house"
kind = "syntax"
target = "TSTypePredicate"
since = "2026-10-03"
message = "hand-written `x is T` guard is banned (writing-typescript): parse the value with a zod schema (safeParse) and use the parsed output; a guard drifts from the type it guards."
bad = ["export function isText(x: unknown): x is string {\n  return typeof x === \"string\";\n}\n"]
good = ["export function isText(x: unknown): boolean {\n  return typeof x === \"string\";\n}\n"]

[[custom]]
id = "no-in-probe"
scope = "house"
kind = "syntax"
target = "BinaryExpression[operator='in']"
since = "2026-10-03"
message = "the `in` operator is banned (writing-typescript): a key probe is an unchecked shape claim. Parse the value with a zod schema (safeParse); for your own union use a discriminant tag; for a record's own key, Object.hasOwn(record, key)."
bad = [
  "export const has = (v: object): boolean => \"k\" in v;\n",
  "export const has = (v: object, k: string): boolean => k in v;\n",
]
good = [
  "export const has = (v: object, k: string): boolean => Object.hasOwn(v, k);\n",
  "export function keys(v: Record<string, number>): string[] {\n  return Object.keys(v);\n}\n",
]

[[custom]]
id = "no-as-cast"
scope = "house"
kind = "syntax"
target = "TSAsExpression:not([typeAnnotation.typeName.name='const'])"
since = "2026-10-03"
message = "`as` cast is banned (writing-typescript): it asserts a type the compiler cannot verify. Parse with a zod schema, or use `satisfies` / inference. (`as const` is allowed.)"
bad = ["export const n = (v: unknown): number => v as number;\n"]
good = ["export const pair = [1, 2] as const;\n"]

[[custom]]
id = "no-angle-cast"
scope = "house"
kind = "syntax"
target = "TSTypeAssertion"
since = "2026-10-03"
message = "`<T>value` cast is banned (writing-typescript): parse with a zod schema, or use `satisfies` / inference."
bad = ["export const n = (v: unknown): number => <number>v;\n"]
good = ["export const pair = [1, 2] as const;\n"]

[[custom]]
id = "no-json-parse"
scope = "house"
kind = "syntax"
target = "CallExpression[callee.object.name='JSON'][callee.property.name='parse']:not(CallExpression[callee.object.name='z'][callee.property.name='codec'] *)"
since = "2026-10-04"
message = "JSON.parse is banned (zod first). Decode JSON text with zod in one step: `jsonOf(Schema).safeParse(text)` — jsonOf/jsonText from the repo's zod module (dotfiles: agents/hooks/zod.ts; another repo: its copy of writing-typescript's assets/consumer-repo/zod.ts). It returns the typed value, or a zod error that covers both bad JSON (code invalid_format) and the wrong shape: no try, no `unknown` round-trip, no annotation. For the raw JSON value use `jsonText` from the same module."
bad = [
  "export const v: unknown = JSON.parse(\"1\");\n",
  "declare const lib: { codec: (f: () => unknown) => unknown };\nexport const c = lib.codec((): unknown => JSON.parse(\"1\"));\n",
]
good = ["import { z } from \"./agents/hooks/zod.ts\";\nexport const c = z.codec(z.string(), z.unknown(), {\n  decode: (s: string): unknown => JSON.parse(s),\n  encode: (v: unknown): string => JSON.stringify(v),\n});\n"]

[[custom]]
id = "no-throwing-parse"
scope = "house"
kind = "syntax"
target = "CallExpression[callee.property.name='parse']:not([callee.object.name='JSON']):not([callee.object.object.name='Bun'])"
since = "2026-10-06"
message = "a throwing `.parse(...)` is banned (zod first): use `.safeParse(...)` and handle the failure as a value — `jsonOf(Schema).safeParse(text)` for JSON text, `Schema.safeParse(value)` otherwise. `jsonText.parse` and `jsonOf(..).parse` are the same throw. The one exemption is Bun's own text parsers (Bun.TOML.parse, Bun.YAML.parse — no safe variant): call one inside attempt() and pass its value to Schema.safeParse."
bad = [
  "import { z } from \"./agents/hooks/zod.ts\";\nexport const n = z.number().parse(1);\n",
  "import { jsonText } from \"./agents/hooks/zod.ts\";\nexport const v: unknown = jsonText.parse(\"1\");\n",
  "import { jsonOf, z } from \"./agents/hooks/zod.ts\";\nexport const n = jsonOf(z.number()).parse(\"1\");\n",
]
good = [
  "import { z } from \"./agents/hooks/zod.ts\";\nexport const r = z.number().safeParse(1);\n",
  "import { jsonOf, z } from \"./agents/hooks/zod.ts\";\nexport const r = jsonOf(z.number()).safeParse(\"1\");\n",
  "export const t: unknown = Bun.TOML.parse(\"a = 1\");\n",
  "export const y: unknown = Bun.YAML.parse(\"a: 1\");\n",
]

[[custom]]
id = "no-untyped-json-body"
scope = "house"
kind = "syntax"
target = "CallExpression[callee.property.name='json'][arguments.length=0]:not([callee.object.name='z'])"
since = "2026-10-04"
message = "`.json()` returns `any` (zod first): read `.text()` and decode it with `jsonOf(Schema).safeParse(text)` (the repo's zod module: dotfiles agents/hooks/zod.ts, elsewhere writing-typescript's assets/consumer-repo/zod.ts), so the body is validated where it enters."
bad = ["export async function f(r: Response): Promise<unknown> {\n  return await r.json();\n}\n"]
good = [
  "export async function f(r: Response): Promise<string> {\n  return await r.text();\n}\n",
  "import { z } from \"./agents/hooks/zod.ts\";\nexport const anyJson = z.json();\n",
]

[[custom]]
id = "no-direct-zod"
scope = "dotfiles"
kind = "import-path"
target = "zod"
since = "2026-10-04"
message = "Import `z` (and `jsonOf` for JSON text) from agents/hooks/zod.ts (relative path), the repo's one zod: hooks run before `bun install`, so zod ships as a generated bundle and every file uses that same copy."
bad = ["import { z } from \"zod\";\nexport const s = z.string();\n"]
good = ["import { z } from \"./agents/hooks/zod.ts\";\nexport const s = z.string();\n"]

[[custom]]
id = "no-direct-zod-subpath"
scope = "dotfiles"
kind = "import-pattern"
target = "zod/*"
since = "2026-10-04"
message = "Import `z` from agents/hooks/zod.ts (relative path), the repo's one zod."
bad = ["import { z } from \"zod/v4\";\nexport const s = z.string();\n"]
good = ["import { z } from \"./agents/hooks/zod.ts\";\nexport const s = z.string();\n"]

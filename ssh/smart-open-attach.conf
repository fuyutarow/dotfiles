# The smart-open forward, scoped to the two sessions that are the screen you sit at — why, and why
# this is its own file, is in ssh/config (smart-open section). Needs an OpenSSH >= 9.9 client:
# scripts/link-dots.ts links it to ~/.ssh/config.d/ only there.
#
# WHICH HOSTS: any whose ~/.ssh/config.local block says `Tag smart-open` — the opt-in stays with
# the private host inventory, so a new box (a rented GPU, a lab server) needs no edit to this PUBLIC
# repo. Until 2026-10-05 this matched `originalhost r99-u24` only, so `oo` on a rented box found no
# socket. The editor alias `<alias>-code` shares that Host line (and so the tag) and is excluded
# here: VS Code's own ssh must reach the box WITHOUT the forward (ssh/config explains why).
Match tagged smart-open originalhost "!*-code,*" sessiontype shell
    RemoteForward /tmp/smart-open-%r--%n.sock %d/.cache/smart-open/receiver.sock
Match tagged smart-open originalhost "!*-code,*" command "*herdr remote-client-bridge*"
    RemoteForward /tmp/smart-open-%r--%n.sock %d/.cache/smart-open/receiver.sock

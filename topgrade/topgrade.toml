# topgrade — dotfiles-managed (symlinked to ~/.config/topgrade.toml by scripts/link-dots.ts).
# Shared across mac & WSL. Step identifiers are the clap values from
# `topgrade --disable __x__` (e.g. flutter, tlmgr, claude_code, juliaup, ...).

[misc]
# Steps to skip on every run.
# gcloud: installed via mise, so `gcloud components update` is blocked by the SDK (managed-by-
# package-manager) and marks the run FAILED — mise itself updates it. Skip it. (2026-07-05)
# snap: prompts for the sudo password on every run, and buys nothing here. `snap list` on this
# host holds only core20 / core26 / snapd (snap's own runtime) plus flutter — and the flutter
# step is already disabled above, so the sudo prompt exists to refresh snapd's own plumbing.
# Refresh it by hand with `sudo snap refresh` if it ever matters. (2026-08-01)
# uv: the installed executable is Homebrew-owned; Topgrade's native step is `uv self update`.
# Keep ownership with the existing `brew_formula` step instead. (2026-10-21)
disable = ["flutter", "tlmgr", "gcloud", "snap", "uv"]

[git]
# Dotfiles is jj/mise-managed (`mise run pull`); do not let Topgrade discover
# it as a predefined Git repository. Explicit `git.repos` remain supported.
pull_predefined = false

# Keep a flaky step running but don't let its failure mark the whole run FAILED.
# (Uncomment to silence the recurring "Claude Code: FAILED" without skipping it.)
# ignore_failures = ["claude_code"]

# Custom steps — ONLY for tools topgrade cannot reach on its own. Measured 2026-07-31 before
# adding anything here, because most of the AI CLIs are already covered and duplicating them
# would just run each updater twice:
#   claude  -> native `claude_code` + `claude_code_plugins` steps, confirmed running
#   grok    -> installed as a brew CASK (`grok-build`), so `brew_cask` upgrades it
#   agy     -> a symlink to a Windows WinGet .exe; no Linux binary exists, so nothing in a
#              WSL topgrade run can update it (it belongs to `winget` on the Windows side)
#   codex   -> provider-owned by agents/codex/codex-update.ts. On WSL that script updates the
#              Windows Desktop provider and refreshes its facade; native macOS/Linux retain the
#              standalone updater. Topgrade must not infer ownership from the Linux launcher.
# Guarded with `command -v` because this file is shared with macOS: an absent tool must skip,
# not fail the run. The guard preserves the updater's own exit code when it IS present.
#
# Provider-specific update/restart behavior belongs to codex-update.ts. The WSL desktop owns its
# app-server; a WSL updater must not create or restart a second daemon.
# KEEP CUSTOM STEPS TO ONE LINE THAT CALLS A REAL FILE. Anything with branching, exit-code
# capture, or JSON belongs in a script under version control, not in this string.
#
# Measured 2026-08-24: the Codex step used to be an inline multi-line snippet, and it had
# NEVER once succeeded. topgrade runs custom commands through `/usr/bin/zsh -c`, where
# `status` is a READ-ONLY special parameter (csh-compatible synonym for `$?`), so its
# `status=$?` aborted with "read-only variable: status" and the whole step reported FAILED.
# Two things let that ship: code inside a config string is seen by no linter (this repo's
# `lint:sh` covers scripts/ tmux/scripts agents/claude lazygit .githooks — not this file),
# and shellcheck could not have caught it anyway because it does not analyse zsh.
# As agents/codex/codex-update.ts it is covered by the existing fmt:ts / lint:bun tasks.
[commands]
"Codex CLI (declared provider)" = 'bun ~/dotfiles/agents/codex/codex-update.ts'

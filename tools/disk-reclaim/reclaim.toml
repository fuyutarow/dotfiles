# Human-owned declarations. Paths are expanded by disk-reclaim, independently of cwd.
repo_roots = ["~/Workspace/*", "~/dotfiles"]
repos = []
scratch_roots = ["/tmp/claude-{uid}"]
delete_roots = ["/tmp", "~/.cache"]
protected = [
  "~/.bun/install/global",
  "~/.bun/bin",
  "~/.local/share/mise/installs",
  "~/.local/share/mise/shims",
  "~/.cargo/bin",
  "~/.rustup/toolchains",
  "~/.local/bin",
  "~/.juliaup",
]
session_grace_hours = 24
graveyard_min_age_hours = 24
graveyard_pressure_undo_minutes = 10
ignore_unreadable_procs = ["sshd"]

[collection_policy.class_rules.ownerless_cache]
default_owner = "dotfiles"
ttl_days = 14

[collection_policy.class_rules.deregistered_index_db]
ttl_days = 7

[[regenerable_caches]]
path = "~/.cache/sccache"
class = "REGENERABLE"
process = "sccache"

[[regenerable_caches]]
path = "~/.cache/Homebrew"
class = "REGENERABLE"
process = "brew"

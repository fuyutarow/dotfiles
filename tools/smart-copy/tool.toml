# The declaration of tools/smart-copy. Contract (fields, who reads each): tools/README.md.
name = "smart-copy"
kind = "A"
purpose = "The one clipboard route: zsh `c`/`pp`/`pwdc`/`q`, the Claude and Codex `/quote` hooks and `codex-thread-copy` copy stdin through it (`mise run doctor:clipboard` reads a copy back)."
# Sourced by config/zsh/aliases.zsh (TOOL_SHELL_FRAGMENTS); lint:zsh parses it; path is relative to this directory.
shell = "shell.zsh"
# Files that call the tool (repo-relative); each must exist and still mention a bin or a shell function.
consumers = [
  "config/zsh/aliases.zsh",
  "agents/claude/hooks/quote-command.ts",
  "agents/codex/hooks/quote-command.ts",
  "tools/codex-thread-copy/src/codex-thread-copy.ts",
]

# PATH command → entry file (relative to this directory); root and tool package.json must agree.
[bins]
smart-copy = "src/smart-copy.ts"

# A probe overwrites live state, so it is its own mise task and never part of `mise run doctor`.
[probes.clipboard]
file = "src/doctor-clipboard.ts"
task = "doctor:clipboard"

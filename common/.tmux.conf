# ========================================
# tmux モダン設定
# ========================================

# ========================================
# 基本設定
# ========================================

# プレフィックスキーをCtrl+gに変更（デフォルトのCtrl+bは使いにくい）
set -g prefix C-g
unbind C-b
bind C-g send-prefix

# エスケープシーケンスの遅延を削除（Vimでの作業を快適に）
set -sg escape-time 0

# ベースインデックスを1から開始（0だとキーボードで押しにくい）
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウとペインのインデックスを自動で振り直す
set -g renumber-windows on

# マウス操作を有効化
setw -g mouse on

# 256色ターミナルサポート
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# コピーモードでViキーバインドを使用
setw -g mode-keys vi

# ヒストリサイズを大きく設定
set -g history-limit 10000

# ========================================
# キーバインド設定
# ========================================

# 設定ファイルの再読み込み
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded!"

# ペイン分割（直感的なキーバインド）
bind | split-window -h -c "#{pane_current_path}"    # 垂直分割
bind - split-window -v -c "#{pane_current_path}"    # 水平分割

# 新しいウィンドウを現在のパスで作成
bind c new-window -c "#{pane_current_path}"

# ペイン間移動（Vimライク）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインサイズ調整（繰り返し可能）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ウィンドウ移動
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# セッション管理
bind v new-session                # 新しいセッション作成
bind f switch-client -n           # 次のセッション
bind b switch-client -p           # 前のセッション

# ========================================
# コピーモード設定（WSL対応）
# ========================================

# コピーモードでのキーバインド（Vimライク）
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# WSL環境でのクリップボード統合
if-shell "command -v clip.exe" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip.exe'" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# マウスドラッグでのコピー
if-shell "command -v clip.exe" \
    "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'clip.exe'" \
    "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# Enterキーでコピー
if-shell "command -v clip.exe" \
    "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'clip.exe'" \
    "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# ========================================
# ステータスライン設定
# ========================================

# ステータスラインを上部に配置
set -g status-position top

# ステータスラインの更新間隔（秒）
set -g status-interval 5

# ステータスライン全体のスタイル
set -g status-style bg=colour235,fg=colour255

# 左側のステータス（セッション名）
set -g status-left-length 30
set -g status-left "#[fg=colour255,bg=colour33,bold] #S #[fg=colour33,bg=colour235]"

# 右側のステータス（日時）
set -g status-right-length 50
set -g status-right "#[fg=colour240,bg=colour235]#[fg=colour255,bg=colour240] %m/%d %H:%M #[fg=colour255,bg=colour33,bold] #h "

# ウィンドウタブのスタイル
setw -g window-status-format "#[fg=colour255,bg=colour235] #I:#W "
setw -g window-status-current-format "#[fg=colour255,bg=colour33,bold] #I:#W "

# ========================================
# ペインボーダー設定
# ========================================

# 非アクティブペインのボーダー
set -g pane-border-style fg=colour240

# アクティブペインのボーダー
set -g pane-active-border-style fg=colour33

# ========================================
# その他の便利な設定
# ========================================

# アクティビティ監視（バックグラウンドウィンドウでの変更を通知）
setw -g monitor-activity on
set -g visual-activity off

# ベルを無効化
set -g visual-bell off
set -g bell-action none

# ペイン同期の切り替え（全ペインに同じコマンドを送信）
bind s setw synchronize-panes

# ペインの境界線を表示/非表示
bind a if -F '#{s/off//:status}' 'set status off' 'set status on'

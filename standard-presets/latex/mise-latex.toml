# Copy/adapt into the repository's root mise.toml.
# Adjust LATEX_DIR, LATEX_MAIN, and task prefixes to fit the repo.

[env]
LATEX_DIR = "papers/2606_001-title_name"
LATEX_MAIN = "main.tex"
# TEXBIN is auto-detected per task (see the `TEXBIN=...` guard below): macOS MacTeX uses
# /Library/TeX/texbin, while linuxbrew/install-tl put binaries on PATH already (TEXBIN stays empty).
# install-tl users with a non-PATH tree: `export TEXBIN=$HOME/texlive/<year>/bin/<arch>-linux` first.

[tasks."latex:setup"]
description = "Install TeX Live packages and modern LaTeX tooling"
depends = ["latex:setup:tex", "latex:setup:modern"]

[tasks."latex:setup:tex"]
description = "Install TeX Live packages (sudo tlmgr on MacTeX/install-tl; user mode on linuxbrew)"
run = '''
TEXBIN="${TEXBIN:-$([ -d /Library/TeX/texbin ] && echo /Library/TeX/texbin)}"
PATH="${TEXBIN:+$TEXBIN:}$PATH"
PKGS="latexmk chktex beamer pgf luatexja haranoaji unicode-math booktabs mathtools \
  collection-latexrecommended collection-luatex collection-langjapanese collection-fontsrecommended"

if [ -d /Library/TeX/texbin ]; then
  # macOS MacTeX: full system-mode tlmgr, but the tree is root-owned → sudo required.
  sudo tlmgr install $PKGS
elif kpsewhich -var-value TEXMFROOT 2>/dev/null | grep -qE 'linuxbrew|/Cellar/'; then
  # linuxbrew texlive: full texmf tree already ships these and system-mode install is BLOCKED.
  # Add only genuinely-missing, relocatable extras in user mode (collections live in the brew base).
  tlmgr init-usertree >/dev/null 2>&1 || true
  for p in $PKGS; do
    case "$p" in collection-*) continue ;; esac
    tlmgr info "$p" 2>/dev/null | grep -qi 'installed:.*yes' && continue
    tlmgr --usermode install "$p" || echo "skip (not relocatable; use install-tl): $p"
  done
else
  # TUG install-tl tree: full system-mode tlmgr (prefix with sudo only if the tree is root-owned).
  tlmgr install $PKGS
fi
'''

[tasks."latex:setup:modern"]
description = "Install modern LaTeX formatter tooling"
run = '''
command -v tex-fmt >/dev/null 2>&1 && exit 0
if command -v brew >/dev/null 2>&1; then
  brew install tex-fmt
elif command -v cargo >/dev/null 2>&1; then
  cargo install tex-fmt
else
  echo "Install tex-fmt from https://github.com/WGUNDERWOOD/tex-fmt/releases"
  exit 127
fi
'''

[tasks."latex:fmt"]
description = "Format LaTeX with tex-fmt"
run = '''
cd "$LATEX_DIR"
tex-fmt "$LATEX_MAIN"
'''

[tasks."latex:fmt:check"]
description = "Check LaTeX formatting with tex-fmt"
run = '''
cd "$LATEX_DIR"
tex-fmt --check "$LATEX_MAIN"
'''

[tasks."latex:lint"]
description = "Lint LaTeX with ChkTeX"
run = '''
cd "$LATEX_DIR"
TEXBIN="${TEXBIN:-$([ -d /Library/TeX/texbin ] && echo /Library/TeX/texbin)}"
PATH="${TEXBIN:+$TEXBIN:}$PATH" chktex -q -v0 -n 1 "$LATEX_MAIN"
'''

[tasks.latex]
description = "Build LaTeX PDF with latexmk"
run = '''
cd "$LATEX_DIR"
TEXBIN="${TEXBIN:-$([ -d /Library/TeX/texbin ] && echo /Library/TeX/texbin)}"
PATH="${TEXBIN:+$TEXBIN:}$PATH" latexmk -r latexmkrc "$LATEX_MAIN"
'''

[tasks."latex:check"]
description = "Format-check, lint, and build LaTeX"
depends = ["latex:fmt:check", "latex:lint", "latex"]

[tasks."latex:clean"]
description = "Clean LaTeX build artifacts"
run = '''
cd "$LATEX_DIR"
TEXBIN="${TEXBIN:-$([ -d /Library/TeX/texbin ] && echo /Library/TeX/texbin)}"
PATH="${TEXBIN:+$TEXBIN:}$PATH" latexmk -r latexmkrc -c "$LATEX_MAIN"
'''

[tasks."latex:distclean"]
description = "Remove all LaTeX build artifacts"
run = '''
cd "$LATEX_DIR"
TEXBIN="${TEXBIN:-$([ -d /Library/TeX/texbin ] && echo /Library/TeX/texbin)}"
PATH="${TEXBIN:+$TEXBIN:}$PATH" latexmk -r latexmkrc -C "$LATEX_MAIN"
# rip is this repo's sanctioned remover; rm fallback keeps the template portable to other repos.
command -v rip >/dev/null 2>&1 && rip build 2>/dev/null || rm -rf build
'''

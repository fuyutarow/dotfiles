# Codex CLI configuration keys maintained by dotfiles.
# Interactive approvals use Codex's reviewer agent; sandbox boundaries stay unchanged.
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# 2026-10-09 evidence: gpt-6-luna accepted 483,584 input tokens and Codex reported a window of 828,400.
model_context_window = 1000000
model_auto_compact_token_limit = 950000

[sandbox_workspace_write]
network_access = true

[tui]
# git-branch and five-hour-limit are left out: codex 0.162.1 always omits them on this setup
# (detached HEAD; weekly-only account), so they would never render.
status_line = ["model-with-reasoning", "current-dir", "context-remaining", "weekly-limit", "used-tokens", "task-progress"]

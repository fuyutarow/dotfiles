# The smart-open forward, scoped to the two sessions that are the screen you sit at — why, and why
# this is its own file, is in ssh/config (smart-open section). Needs an OpenSSH >= 9.9 client:
# scripts/link-dots.ts links it to ~/.ssh/config.d/ only there.
Match originalhost r99-wsl sessiontype shell
    RemoteForward /tmp/smart-open-%r--%n.sock %d/.cache/smart-open/receiver.sock
Match originalhost r99-wsl command "*herdr remote-client-bridge*"
    RemoteForward /tmp/smart-open-%r--%n.sock %d/.cache/smart-open/receiver.sock

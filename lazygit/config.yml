# lazygit/config.yml — dotfiles-managed; symlinked per-OS by scripts/link-dots.sh
#   mac: ~/Library/Application Support/lazygit/config.yml
#   WSL: ~/.config/lazygit/config.yml   (lazygit honors XDG_CONFIG_HOME on both OSes)
# Edit ~/dotfiles/lazygit/* then `mise run link-dots` — never edit the linked copy.
#
# Ctrl+A in the Files panel → AI commit message via ~/dotfiles/lazygit/ai-commit.sh.
# (Ctrl, not Alt: macOS terminals don't send Option as Meta by default, so <a-c>
#  never reaches lazygit. Ctrl is transmitted reliably on both mac and WSL.)
# PRIVACY: that sends your STAGED DIFF to Anthropic, and the keybinding is GLOBAL
# (every repo, not just dotfiles) — never use it where the diff may hold secrets.
customCommands:
  - key: "<c-a>"                 # Ctrl+A; free in the files context (c/C/w/a/A are taken)
    context: "files"             # canonical staged-files context (lazygit does NOT validate this — keep exact)
    description: "AI commit message (claude)"
    loadingText: "Asking claude for a commit message..."
    output: terminal             # suspend lazygit to a real TTY so `git commit -e` can open the editor
    command: "$HOME/dotfiles/lazygit/ai-commit.sh"

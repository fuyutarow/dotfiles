# Codex CLI configuration keys maintained by dotfiles.
# Interactive approvals use Codex's reviewer agent; sandbox boundaries stay unchanged.
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# 2026-10-09 evidence: gpt-6-luna accepted 483,584 input tokens and Codex reported a window of 828,400.
model_context_window = 1000000
model_auto_compact_token_limit = 950000

[sandbox_workspace_write]
network_access = true

[tui]
# Codex 0.162.1 renders the footer on one line and clips at the right edge, so identity and model
# come first. Dropped thread-name/title, context-used, project-name, total-input/output-tokens,
# codex-version, reasoning, and thread-credits as duplicates or low value. Owner approved 2026-10-11.
# Items without runtime data may be omitted by Codex.
status_line = [
  "thread-id",
  "model-with-reasoning",
  "git-branch",
  "current-dir",
  "run-state",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "estimated-thread-cost",
  "task-progress",
  "used-tokens",
  "fast-mode",
]

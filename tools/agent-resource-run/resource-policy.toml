# Runner policy. gpu_max_concurrent_jobs is retained and parsed for compatibility only.
# GPU admission is bounded by declared VRAM reservations, the safety margin and ccc partition.
schema = 1
gpu_max_concurrent_jobs = 6

# Start reclaim/throttling at 90% of each job's hard RAM ceiling, leaving headroom
# for reclaim before MemoryMax can trigger an OOM kill.
memory_high_fraction = 0.9

# Compatibility capacity declarations: example-repo envs/jq/jq_capacity.py reads these.
# The thin runner does not reserve or aggregate these resources.
min_host_ram_safety_gib = 4
host_ram_safety_fraction = 0.1
gpu_safety_mib = 512

# Resident services and jq_capacity.py retain their partition declarations.
# gpu_partition.py and cocoindex/ccc-daemon-launch.py are independent consumers.
gpu_partition_device = 0
gpu_partition_ccc_mib = 2048
gpu_partition_rerank_mib = 2048

# ========================================
# tmux モダン設定
# ========================================

# ========================================
# 基本設定
# ========================================

# プレフィックスキー設定
set -g prefix C-g         # prefix: Ctrl+g
unbind C-b
unbind C-Space            # 旧primary prefix を解放
bind C-g send-prefix      # Ctrl+g でprefix送信（ネスト時の透過用）

# 全角文字でもプレフィックスとして機能させる（IME対応）
bind -n M-ｇ switch-client -T prefix    # 全角Alt+g
bind -n C-ｇ switch-client -T prefix    # 全角Ctrl+g

# エスケープシーケンスの遅延を削除（Vimでの作業を快適に）
set -sg escape-time 0

# ベースインデックスを1から開始（0だとキーボードで押しにくい）
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウとペインのインデックスを自動で振り直す
set -g renumber-windows on

# マウス操作を有効化
setw -g mouse on

# 256色ターミナルサポート
set -g default-terminal "tmux-256color"
# true color / clipboard の terminal-features は tmux/clipboard.conf に集約（旧: terminal-overrides Tc）

# コピーモードでViキーバインドを使用
setw -g mode-keys vi

# ヒストリサイズを大きく設定
set -g history-limit 10000

# クロスプラットフォーム clipboard / true-color / URL（OS分岐, topic-first）
source-file -q ~/dotfiles/tmux/clipboard.conf

# ========================================
# キーバインド設定
# ========================================

# 設定ファイルの再読み込み
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded!"

# ペイン分割（直感的なキーバインド）
bind | split-window -h -c "#{pane_current_path}"    # 垂直分割
bind - split-window -v -c "#{pane_current_path}"    # 水平分割

# 新しいウィンドウを現在のパスで作成
bind c new-window -c "#{pane_current_path}"

# 自動ウィンドウ名設定（プロジェクト名 + Git branch表示）
set-option -g automatic-rename on
# 自動ウィンドウ名は built-in (#{pane_current_command}) — fork無し。プロジェクト/branch が要れば zsh chpwd フックで rename-window

# ペイン間移動（Vimライク + 全角対応）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 全角文字でも同じ動作（IME ON時対応）
bind ｈ select-pane -L    # 全角h
bind ｊ select-pane -D    # 全角j
bind ｋ select-pane -U    # 全角k
bind ｌ select-pane -R    # 全角l

# ペインサイズ調整（繰り返し可能 + 全角対応）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 全角大文字でも同じ動作
bind -r Ｈ resize-pane -L 5    # 全角H
bind -r Ｊ resize-pane -D 5    # 全角J
bind -r Ｋ resize-pane -U 5    # 全角K
bind -r Ｌ resize-pane -R 5    # 全角L

# ウィンドウ移動
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# セッション管理
bind v new-session                # 新しいセッション作成
bind f switch-client -n           # 次のセッション
bind b switch-client -p           # 前のセッション

# ========================================
# コピーモード設定（WSL対応）
# ========================================

# コピーモードでのキーバインド（Vimライク）
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# システムクリップボード copy(y/Enter/MouseDrag) は OS分岐で tmux/clipboard.conf に集約

# ========================================
# ステータスライン設定
# ========================================

# ステータスラインを上部に配置
set -g status-position top

# ステータスラインの更新間隔（秒）
set -g status-interval 5

# One Half Dark風のカラー設定
# 背景: #282c34, テキスト: #dcdfe4, 青: #61afef, グレー: #5c6370

# ステータスライン全体のスタイル
set -g status-style bg=colour236,fg=colour250

# 左側のステータス（セッション名）
set -g status-left-length 30
set -g status-left "#[fg=colour235,bg=colour75] #S #[fg=colour75,bg=colour236]"

# 右側のステータス（システム監視 + 日時）
set -g status-right-length 80
set -g status-right "#[fg=colour245,bg=colour236] #{cpu_percentage} #{ram_percentage} #[fg=colour241,bg=colour236]#[fg=colour250,bg=colour241] %m/%d %H:%M #[fg=colour235,bg=colour75] #h "

# ウィンドウタブのスタイル
setw -g window-status-format "#[fg=colour245,bg=colour236] #I:#W "
setw -g window-status-current-format "#[fg=colour236,bg=colour75] #I:#W "

# ========================================
# ペインボーダー設定
# ========================================

# 非アクティブペインのボーダー（One Half Darkのグレー）
set -g pane-border-style fg=colour241

# アクティブペインのボーダー（One Half Darkの青）
set -g pane-active-border-style fg=colour75

# ========================================
# ペイン背景色設定（True Color - Tailwind Slate風）
# ========================================
#
# 現在の設定（colour235/236）もお気に入りで完璧な設定です！
# 以下はTrue Color版のTailwind Slate色への更新ですが、
# いつでも元の設定に戻せるように両方を保持しています。
#
# === 従来の設定（256色、お気に入り）===
# set -g window-active-style bg=colour235    # #262626 (お気に入りの設定)
# set -g window-style bg=colour236           # #303030 (お気に入りの設定)
#
# === 新しい設定（True Color - One Half Dark） ===
# アクティブ/非アクティブペインの背景色を設定
# - アクティブペイン: #21252b (One Half Dark より暗い関連色)
# - 非アクティブペイン: #282c34 (One Half Dark メイン背景色)
#
# この組み合わせにより：
# - 十分なコントラストでアクティブペインが識別しやすい
# - One Half Darkテーマとの完璧な統一感
# - True Color対応で256色制限を超えた正確な色表現
# - VS Codeなどでお馴染みの落ち着いたダークトーン
#
# 注意: True Color対応ターミナルが必要
# 設定済み: set -ga terminal-overrides ",*256col*:Tc"
#
# 【重要】元のcolour235/236設定もお気に入りなので絶対に削除しないこと！
#
set -g window-active-style 'bg=#21252b'
set -g window-style 'bg=#282c34'

# ========================================
# その他の便利な設定
# ========================================

# アクティビティ監視（バックグラウンドウィンドウでの変更を通知）
setw -g monitor-activity on
set -g visual-activity off

# 異なるサイズのクライアント対応（アグレッシブリサイズ）
setw -g aggressive-resize on

# ベルを無効化
set -g visual-bell off
set -g bell-action none

# ペイン同期の切り替え（全ペインに同じコマンドを送信）
bind s setw synchronize-panes

# ペインの境界線を表示/非表示
bind a if -F '#{s/off//:status}' 'set status off' 'set status on'

# システム監視はオンデマンド popup（重い指標を status から退避）
bind G display-popup -E -w 90% -h 90% 'btop 2>/dev/null || top'

# ========================================
# GUI操作の強化設定
# ========================================

# マウスホイールでのスクロール量を増やす
bind -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down


# ダブルクリックで単語選択
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word

# トリプルクリックで行選択
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# マウス操作は上記の `setw -g mouse on` で統合的に有効化済み
# 古いオプション（mouse-resize-pane, mouse-select-window, mouse-select-pane）は
# 新しいtmuxでは無効なため削除済み

# ペインのドラッグ＆ドロップでペイン配置を変更（Shift+ドラッグ）
bind -T root S-MouseDrag1Pane swap-pane -d -t=

# マウス中クリックのペーストは OS分岐で tmux/clipboard.conf に集約

# ステータスバーのウィンドウ部分をクリックで選択
bind -T root MouseDown1Status select-window -t=

# ステータスバーの右クリックでセッション選択メニュー
bind -T root MouseDown3Status display-menu -T "#[align=centre]セッション" -x M -y S \
    "セッション一覧"  s "choose-tree -Zs" \
    "新規セッション"  n "command-prompt 'new-session -s %%'"

# ========================================
# ペインレイアウト管理
# ========================================

# プリセットレイアウト切り替え
bind '!' select-layout even-horizontal    # 水平均等配置
bind '@' select-layout even-vertical      # 垂直均等配置
bind '#' run-shell '~/dotfiles/tmux/scripts/layout-11pane-educational.sh'   # カスタム11ペイン教育的レイアウト (教材スクリプト)
# ┌─────────┬─────────┬─────────┬─────────┬─────────┬─────────┐
# │         │    2    │    4    │         │         │    8    │
# │    1    ├─────────┼─────────┤    6    │    7    ├─────────┤
# │         │    3    │    5    │         │         │    9    │
# └─────────┴─────────┴─────────┴─────────┴─────────┴─────────┘
bind '$' run-shell '~/dotfiles/tmux/scripts/layout-10pane-merged.sh'   # カスタム10ペイン結合レイアウト
# ┌─────────┬─────────┬─────────┬─────────┬─────────┬─────────┐
# │         │    2    │    3    │         │    5    │    6    │
# │    1    ├─────────┼─────────┤    4    ├─────────┴─────────┤
# │         │    2    │    3    │         │                   │
# └─────────┴─────────┴─────────┴─────────┴───────────────────┘
bind '%' run-shell '~/dotfiles/tmux/scripts/layout-11pane-3level.sh'   # 複雑11ペイン3段階レイアウト
# ┌─────────┬─────────┬─────────┬─────────┬─────────┬─────────┐
# │         │    2    │    4    │         │    7    │    8    │
# │    1    ├─────────┼─────────┤    6    ├─────────┼─────────┤
# │         │    3    │    5    │         │    9    │   10    │
# └─────────┴─────────┴─────────┴─────────┴─────────┴─────────┘
bind '^' run-shell '~/dotfiles/tmux/scripts/layout-complex-12pane.sh'   # 複雑12ペインレイアウト
# ┌─────────┬─────────┬─────────┬─────────┬─────────┬─────────┬─────────┐
# │         │    2    │    4    │         │         │    7    │    8    │
# │    1    ├─────────┼─────────┤    6    │    ?    ├─────────┼─────────┤
# │         │    3    │    5    │         │         │    9    │   10    │
# └─────────┴─────────┴─────────┴─────────┴─────────┴─────────┴─────────┘
bind '&' select-layout tiled             # タイル状配置

# レイアウトを循環
bind Space next-layout

# ペイン配置の入れ替え
bind < swap-pane -U    # 前のペインと入れ替え
bind > swap-pane -D    # 次のペインと入れ替え

# ペインの回転
bind C-o rotate-window -D    # 時計回りに回転
bind M-o rotate-window -U    # 反時計回りに回転

# ペインを別ウィンドウに移動
bind B break-pane   # 旧 ! (Shift+1 を preset に譲渡)

# 別ウィンドウのペインを現在のウィンドウに結合
bind A command-prompt -p "join pane from:" "join-pane -s '%%'"

# ペインを指定ウィンドウに送る
bind S command-prompt -p "send pane to:" "join-pane -t '%%'"

# 現在のレイアウトを保存/復元
bind M-s run 'tmux display-message -p "#{window_layout}" > ~/.tmux-layout-#{session_name}-#{window_index}'
bind M-r run 'tmux select-layout "$(cat ~/.tmux-layout-#{session_name}-#{window_index})"'

# ペインサイズの均等化
bind = select-layout even-horizontal \; select-layout even-vertical

# メインペインサイズの調整（main-horizontal/main-vertical用）
bind M-h resize-pane -t 0 -x 70%    # メインペインを画面の70%に
bind M-v resize-pane -t 0 -y 70%    # メインペインを画面の70%に

# ペインフォーカスの記憶と復元
bind m run 'echo "#{pane_id}" > ~/.tmux-last-pane-#{session_id}' \; display 'Marked pane #{pane_index}'
bind M run 'tmux select-pane -t $(cat ~/.tmux-last-pane-#{session_id})' \; display 'Jumped to marked pane'

# レイアウト調整モード（連続キー入力可能）
bind -r M-Left resize-pane -L 5
bind -r M-Down resize-pane -D 5
bind -r M-Up resize-pane -U 5
bind -r M-Right resize-pane -R 5

# GUI右クリックメニューにレイアウト機能を追加
bind -T root MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -x M -y M \
    "水平分割"                             h   "split-window -v -c '#{pane_current_path}'" \
    "垂直分割"                             v   "split-window -h -c '#{pane_current_path}'" \
    "" \
    "ペインを閉じる"                       x   "kill-pane" \
    "ペインを最大化/元に戻す"             z   "resize-pane -Z" \
    "" \
    "レイアウト" \
    "  水平均等"                           1   "select-layout even-horizontal" \
    "  垂直均等"                           2   "select-layout even-vertical" \
    "  メイン水平"                         3   "select-layout main-horizontal" \
    "  メイン垂直"                         4   "select-layout main-vertical" \
    "  タイル"                             5   "select-layout tiled" \
    "" \
    "ペインを入れ替え" \
    "  前と入れ替え"                       [   "swap-pane -U" \
    "  次と入れ替え"                       ]   "swap-pane -D" \
    "" \
    "別ウィンドウへ移動"                   !   "break-pane" \
    "" \
    "新しいウィンドウ"                     c   "new-window -c '#{pane_current_path}'" \
    "ウィンドウ名を変更"                   n   "command-prompt -I '#W' 'rename-window %%'" \
    "" \
    "コピーモード"                         e   "copy-mode" \
    "履歴をクリア"                         C   "send-keys C-l ; clear-history"

# ========================================
# ヘルプ表示機能
# ========================================

# カスタムヘルプ表示
bind ? display-menu -T "#[align=centre]tmux キーバインド一覧" -x C -y C \
    "#[fg=colour33,bold]== 基本操作 ==" \
    "Prefix + r         設定再読み込み"         "" "" \
    "Prefix + ?         このヘルプを表示"       "" "" \
    "" \
    "#[fg=colour33,bold]== ペイン操作 ==" \
    "Prefix + |         垂直分割"               "" "" \
    "Prefix + -         水平分割"               "" "" \
    "Prefix + h/j/k/l   ペイン移動"            "" "" \
    "Prefix + H/J/K/L   ペインサイズ変更"      "" "" \
    "Prefix + z         ペイン最大化"           "" "" \
    "Prefix + x         ペインを閉じる"         "" "" \
    "" \
    "#[fg=colour33,bold]== レイアウト・整列 ==" \
    "Pfx S-1            水平均等配置"           "" "" \
    "Pfx S-2            垂直均等配置"           "" "" \
    "Pfx S-3            教育的11ペインレイアウト"     "" "" \
    "Pfx S-4            カスタム10ペイン結合レイアウト" "" "" \
    "Pfx S-5            複雑11ペイン3段階レイアウト"  "" "" \
    "Pfx S-6            複雑12ペインレイアウト"  "" "" \
    "Pfx S-7            タイル状配置"           "" "" \
    "Space              レイアウト循環"         "" "" \
    "Prefix + =         ペインサイズ均等化"     "" "" \
    "Prefix + </>       ペイン入れ替え"        "" "" \
    "Prefix + C-o       ペイン回転"            "" "" \
    "Prefix + M-h       メイン横70%"           "" "" \
    "Prefix + M-v       メイン縦70%"           "" "" \
    "" \
    "#[fg=colour33,bold]== ウィンドウ ==" \
    "Prefix + c         新規ウィンドウ"         "" "" \
    "Prefix + C-h/l     ウィンドウ移動"        "" "" \
    "Prefix + ,         ウィンドウ名変更"       "" "" \
    "" \
    "#[fg=colour33,bold]== セッション ==" \
    "Prefix + v         新規セッション"         "" "" \
    "Prefix + f/b       セッション切替"        "" "" \
    "Prefix + d         デタッチ"              "" "" \
    "" \
    "#[fg=colour33,bold]== コピーモード ==" \
    "Prefix + [         コピーモード開始"       "" "" \
    "v                  選択開始"               "" "" \
    "y                  コピー＆終了"           "" "" \
    "" \
    "#[fg=colour33,bold]== マウス操作 ==" \
    "右クリック         コンテキストメニュー"   "" "" \
    "ダブルクリック     単語選択"              "" "" \
    "中クリック         ペースト"              "" ""

# 全キーバインド表示（デフォルトのlist-keys）
bind / list-keys

# ========================================
# URL選択・表示の改善設定
# ========================================

# URL選択の根本的改善 - URL内の記号を単語区切りから除外
set -g word-separators ' \t'

# URL を開く(bind u) は OS分岐で tmux/clipboard.conf、さらに tmux-fzf-url が上書き

# pane最大化トグル - URL全体表示用
bind-key U resize-pane -Z   # zoom トグル（旧: 同一分岐の無意味な if を簡約）


# 検索時の折り返し無効
set -g wrap-search off

# ========================================
# プラグイン (TPM) — hybrid: native 修正 + 厳選プラグイン
# ========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'          # クロスプラットフォーム copy（手製分岐を代替）
set -g @plugin 'tmux-plugins/tmux-resurrect'     # 全セッション/cwd/プログラム永続化
set -g @plugin 'tmux-plugins/tmux-cpu'           # status の #{cpu_percentage}/#{ram_percentage}
set -g @plugin 'wfxr/tmux-fzf-url'               # URL を fzf popup で開く（OS自動判定）
set -g @plugin 'tmux-plugins/tmux-continuum'     # 自動保存/復元（必ず最後の plugin）

# tmux-yank: WSL は iconv->UTF-16 を維持（yank 既定は日本語/絵文字が化ける）
if-shell 'command -v clip.exe >/dev/null 2>&1' "set -g @override_copy_command 'iconv -t utf-16le | clip.exe'"

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# 初回起動時に TPM を自動 clone（新マシンが自己治癒）
if 'test ! -d ~/.tmux/plugins/tpm' \
   'run "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'

# TPM 起動（必ずファイル末尾）
run '~/.tmux/plugins/tpm/tpm'

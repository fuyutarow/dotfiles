# Units that are red on alpha today, with the day they were first seen and why. scripts/test-units.ts
# prints a listed unit that fails as `KNOWN-RED <s>s <unit>` and does not count it as a failure; a
# listed unit that PASSES fails the run ("passes: remove it from lint/test-known-red.toml"), so a
# fixed unit leaves this list in the commit that fixes it. `--strict` ignores the list. A path that
# is not a unit (see `bun scripts/test-units.ts --list`) is a usage error, exit 2.

# Mise configuration for dotfiles management — the ONLY task runner for this repo.
# (justfile was retired; `j`/`jl` aliases remain for per-project justfiles elsewhere.)
# Single sources of truth: symlinks -> scripts/link-dots.ts, tools -> Brewfile,
# tool check -> scripts/check-tools.sh.
# 命名は wiring-mise-tasks 契約 (fmt/f fmt:check lint/l test/t up/u check/c)。この repo は
# 言語プロジェクトでなく機械設定ゆえ setup は OS 別 init に分割:
# mise-contract: waive setup -- OS-split into mac:init / wsl:init

# RUNTIME-DECLARED (wiring-mise-tasks, 2026-07-25). Task bodies below invoke `bun`; declaring
# it here is what makes those bodies correct on a machine that has not run `brew bundle` yet.
# Measured before this line existed: mise carried bun 1.2.22 while PATH resolved Homebrew's
# 1.3.14, so which bun a task actually ran was decided by PATH order, not by this repo.
# "1.4" since 2026-09-27: a minor-line floor, not an exact pin. 1.4 is the first line with
# Temporal on by default, so the floor is a runtime contract; patches follow without an edit.
# Not "latest" — that would cross into 1.5/2.0 silently. The previous exact "1.3.14" was chosen
# only as "newest on 2026-07-25" and then fell behind Homebrew's bun, because nothing bumps an
# exact pin. Every bun < 1.4 pin mise tracked on this machine was raised the same day; since
# mise auto_install=true, an untracked repo still pinning < 1.4 re-installs the old bun on use.
# uv / rust are NOT declared, and no longer need to be: the FAILs that said otherwise were a
# gate defect, not debt. Measured 2026-08-30 — the only `uv` in this file was inside
# `echo "... (uv tool install cocoindex-code)"`, a MESSAGE, never an invocation. The runtime
# census matched inside quoted strings, and the false positive had been written up here as
# deliberate non-compliance. mise-contract now strips echo/printf arguments before the census.
# If a body ever really invokes uv or rust, it will FAIL again, and that FAIL will be true.
[tools]
bun = "1.4"
rumdl = "0.2.78"

[tasks.up]
alias = "u"
description = "Update system packages"
# scripts/up.ts: never a silent success, and never a sudo attempt where we have no sudo.
run = "bun ~/dotfiles/scripts/up.ts"

# ── shell ────────────────────────────────────────────────────────────────────
# The zsh alias in zsh/aliases.zsh is the primary `relogin`; this is its mise-side entrypoint.
# It looks like a second home for the same three tokens, but it is a DIFFERENT entrypoint to the
# same act, and it exists because the alias cannot cover its own failure case: an alias is baked
# into a shell at startup, while mise.toml is re-read from disk on every `mise run`. So the one
# situation that most calls for a relogin — this shell predates the config it should be running —
# is exactly the situation where the alias may not be defined yet. Observed 2026-08-23 on WSL:
# `relogin` → "command not found" in a shell older than the commit that added the alias.
#
# NOT equivalent to the alias, and the difference is not visible at runtime. `mise run` is a
# child; a child cannot replace its parent. The alias `exec`s, so your shell IS the new one;
# this opens a NESTED login shell and `exit` drops you back into the old, stale one. SHLVL does
# not give it away either — measured 2026-08-23, both paths leave SHLVL unchanged (zsh's exec
# fixup on one side, mise not being a shell on the other). Alias for daily use; this for rescue.
#
# Everything else about the resulting shell IS identical to the alias's — measured in a real pty
# on the same cwd: same first PATH entry, same 21 PATH entries, same MISE_SHELL/__MISE_DIFF.
# `mise run` leaks no extra activation state into the login shell.
#
# dir is load-bearing: a task's dir DEFAULTS to {{config_root}}, so without this line a relogin
# from ~/dotfiles/zsh would silently land you in ~/dotfiles (measured). raw declares that this
# task owns the terminal; a lone foreground task happens to inherit stdio without it, but that is
# incidental, not contract — and it would stop being true the moment this task gained a sibling.
[tasks.relogin]
alias = "rl"
description = "Open a fresh login zsh (mise-side entrypoint for the `relogin`/`rl` alias; use when the alias itself is stale or missing). NESTS rather than replaces — `exit` returns to the old shell."
dir = "{{cwd}}"
raw = true
quiet = true
run = 'exec zsh -l'

# ── Format / Lint ────────────────────────────────────────────────────────────
# fmt (alias f) + lint aggregate over per-language sub-tasks (<domain>:<action>),
# mirroring qoed. Markdown = rumdl (.rumdl.toml). Shell = shfmt + shellcheck for
# bash. TypeScript = the ox toolchain, same as Coral-dpp: oxfmt for FORMAT (.oxfmtrc.json)
# + oxlint for LINT (.oxlintrc.json, see lint:ts) + tsgo for TYPES (tsconfig.json, see
# typecheck), all pinned in package.json and restored by `mise run deps`. oxfmt replaced
# biome on 2026-09-12 with a ZERO-diff migration: `.oxfmtrc.json` (2-space, width 80,
# double quotes, semi, trailing commas) reproduced biome's output byte-for-byte on all 93
# house TS files, so history carries no reformat commit. zsh is syntax-gated with `zsh -n`
# ONLY: shfmt's zsh dialect (v3.13+) is real but incomplete, and these zsh files are
# boot-critical config (break = no interactive shell), so we do NOT auto-format them.
# Bash file discovery is centralised via `shfmt -f <dirs>` (extension+shebang
# detection); TS discovery is oxfmt's own glob walk, `'**/*.ts'` (node_modules, archives and the
# vendored agents/hooks/vendor bundle are oxfmt-ignored in .oxfmtrc.json). agents/skills/** WAS excluded
# "for vendored skill templates"; measured 2026-10-06 there is no TS template in any skill — the
# exclusion only left the skills' own scripts and tests unformatted (and a stray prettier run in them
# unrecoverable), so it was removed. JSON/TOML are deliberately NOT auto-formatted: the JSON population
# is dominated by karabiner's vendored/auto-backup files and boot-critical config — hence
# the explicit *.ts glob rather than a bare `oxfmt .`. `-ln bash` pins shfmt's dialect
# deterministically (and makes shfmt ignore any stray .editorconfig).

[tasks.fmt]
alias = "f"
description = "Format the repo in place: Markdown (rumdl) + bash (shfmt) + TypeScript (oxfmt). alias: f"
depends = ["fmt:md", "fmt:sh", "fmt:ts"]

[tasks."fmt:md"]
dir = "{{config_root}}"
description = "Format Markdown with rumdl (config = .rumdl.toml: structural gate, authored docs only, agents/skills/** excluded)"
run = "rumdl fmt"

[tasks."fmt:sh"]
description = "Format bash scripts in place with shfmt (2-space, -ci -sr -bn -s; bash dialect)"
run = 'bun ~/dotfiles/scripts/fmt-sh.ts'

[tasks."fmt:sh:check"]
description = "Check bash formatting without writing (CI gate; prints diff + non-zero on drift)"
run = 'bun ~/dotfiles/scripts/fmt-sh-check.ts'

[tasks."fmt:ts"]
dir = "{{config_root}}"
description = "Format TypeScript in place with oxfmt (.oxfmtrc.json)"
run = "bunx --bun oxfmt '**/*.ts'"

[tasks."fmt:ts:check"]
dir = "{{config_root}}"
description = "Check TS formatting without writing (CI gate; lists drifted files + non-zero on drift)"
run = "bunx --bun oxfmt --check '**/*.ts'"

# Umbrella format-check for the auto-formatted languages (Markdown check = lint:md via
# rumdl, kept there since rumdl check is a structural lint not a format-verify).
[tasks."fmt:staged"]
description = "Verify selected jj snapshot formatting; Git migration fallback formats staged files and refuses partial hunks (wiring-mise-tasks fmt:staged)"
run = "bun agents/skills/wiring-mise-tasks/scripts/fmt-staged.ts --tool 'ts=bunx --bun oxfmt' --tool 'sh=shfmt -w -ln bash -i 2 -ci -sr -bn -s' --tool 'md=rumdl fmt' --exclude 'agents/skills/**/*.ts' --exclude 'archives/**'"

[tasks."fmt:check"]
description = "整形チェック (CI用・非破壊): bash (shfmt) + TypeScript (oxfmt)"
depends = ["fmt:sh:check", "fmt:ts:check"]

[tasks.lint]
alias = "l"
description = "Lint the repo: Markdown + shell/zsh + Bun script contract + TS (oxlint + tsgo) + skills index"
depends = [
  "lint:md",
  "lint:sh",
  "lint:zsh",
  "lint:bun",
  "lint:ts",
  "lint:ts-ratchet",
  "lint:oxlint-policy",
  "vendor:deps:check",
  "lint:one-writer",
  "lint:config-map",
  "lint:live-refs",
  "typecheck",
  "lint:skills-index",
  "lint:skills-wiring",
  "lint:skills-floor",
  "lint:harness-scope",
  "lint:gates",
]

[tasks."lint:md"]
dir = "{{config_root}}"
description = "Markdown structural gate: rumdl check (render-breaking defects only; cosmetic disabled → green at adoption, catches future/AI-generated defects)"
run = "rumdl check"

[tasks."lint:sh"]
description = "ShellCheck static analysis on bash scripts (-x follow sources; file list reused from shfmt -f)"
run = 'bun ~/dotfiles/scripts/lint-sh.ts'

[tasks."lint:zsh"]
description = "zsh syntax gate: `zsh -n` parse-only on boot-critical zsh config (MUST use the zsh binary, never bash -n)"
run = 'bun ~/dotfiles/scripts/lint-zsh.ts'

[tasks."lint:skills-index"]
description = "Catalog completeness: every agents/skills/*/ with a SKILL.md must be linked in agents/skills/README.md"
run = 'bun ~/dotfiles/scripts/lint-skills-index.ts'

[tasks."lint:skills-wiring"]
dir = "{{config_root}}"
description = "Fail when a repo-owned skill is masked by a real dir in ~/.claude/skills, when ~/.agents/skills no longer points here, or when the provenance ledger drifts. Machine-state checks SKIP (not fail) on a fresh clone."
run = "bun ~/dotfiles/scripts/skills-doctor.ts"

# forging-skills' own floor, run over the WHOLE collection. It existed since the skill was forged
# but was only ever invoked by hand on one skill at a time during a forge, so nothing swept the
# rest: six orphan-reference FAILs sat in turnstile-spin from 2026-06-19 until 2026-08-15, and
# fifteen plain-scalar descriptions waited for the one ': ' that would break a strict parser
# (compiling-latex found it). --budget adds the F4 STANDING check the per-skill pass cannot make:
# what the collection charges every turn, against a declared ratchet.
[tasks."lint:skills-floor"]
dir = "{{config_root}}"
description = "Structural skill floor and listing budget over the jj commit candidate (BASE plus selected REV paths), or the Git index during migration"
run = "bun scripts/lint-skills-floor.ts"

# operating-the-harness P3: a rule naming ONE repo belongs in that repo's .claude/, never in user
# scope behind a cwd check. The check existed since that skill was forged but nothing ran it, so
# three firedancer-gated hooks sat here for weeks after their properly-scoped successors had already
# landed in that repo — firing twice inside it and no-oping everywhere else.
# Root is agents/claude, NOT the default ~/.claude: the RENDERED settings.json legitimately carries
# the machine-specific autoMode overlay (see scripts/render-home.ts), and P3 is about
# what this repo SHARES, not what one machine ends up holding.
[tasks."lint:harness-scope"]
dir = "{{config_root}}"
description = "Fail when a user-scope config or hook in this repo hardcodes one repo's absolute path (operating-the-harness P3)"
run = "bun agents/skills/operating-the-harness/scripts/scope-check.ts agents/claude && bun agents/skills/operating-the-harness/scripts/scope-check.ts agents/codex"

[tasks."lint:gates"]
dir = "{{config_root}}"
description = "Batched-diagnostics floor (operating-the-harness §3): every deny site in a PreToolUse gate declares FATAL / SINGLE-AXIS / BATCHED, and a BATCHED gate carries a test proving two violations return in one decision"
run = "bun agents/skills/operating-the-harness/scripts/gate-diagnostics-check.ts agents/claude/hooks && bun agents/skills/operating-the-harness/scripts/gate-diagnostics-check.ts agents/hooks"

# The TS lint policy lives in oxlint-policy.toml (rules, reasons, custom bans with bad/good
# snippets); .oxlintrc.json is generated from it. scripts/tests/oxlint-policy.test.ts (test:scripts)
# proves each custom ban fires on its bad snippet and is silent on its good one.
[tasks."oxlint:render"]
dir = "{{config_root}}"
description = "Render oxlint-policy.toml (the one home of the TS lint policy) into .oxlintrc.json"
run = "bun scripts/render-oxlintrc.ts --write"

[tasks."lint:oxlint-policy"]
dir = "{{config_root}}"
description = "Fail when .oxlintrc.json is not a fresh render of oxlint-policy.toml"
run = "bun scripts/render-oxlintrc.ts --check"

# INV-8 (README → Design): data flows one way — declaration → render → deployed → runtime — and
# every file has ONE writer. This gate fails when a hand-written declaration carries content a
# renderer owns (a registry hook in a committed vendor file, a rendered roster in CLAUDE.md).
[tasks."lint:one-writer"]
dir = "{{config_root}}"
description = "INV-8 one writer per file: fail when a hand-written declaration carries content scripts/render-home.ts owns"
run = "bun scripts/one-writer-check.ts"

# The config registry (scripts/config-registry.ts) is the one table of every configuration surface:
# source, deploy kind, consumer, writer, verifier. config:map prints it; lint:config-map fails when
# a tracked config-shaped file is in no row, or a row names a source that does not exist.
[tasks."config:map"]
dir = "{{config_root}}"
description = "Print every configuration surface (source → deployed, consumer, writer, verifier) from scripts/config-registry.ts. --json for a tool"
run = "bun scripts/config-map.ts"

[tasks."lint:config-map"]
dir = "{{config_root}}"
description = "Fail when a tracked config-shaped file is registered in no scripts/config-registry.ts row, or a row names a missing source"
run = "bun scripts/config-map.ts --check"

[tasks."lint:live-refs"]
dir = "{{config_root}}"
description = "Fail when a deployed or declared agent command, repo link, or package bin points at a missing checkout file"
run = "bun scripts/live-refs.ts"

[tasks."vendor:deps"]
dir = "{{config_root}}"
description = "Regenerate agents/hooks/vendor/deps.{js,d.ts}: the one zod (+ neverthrow fromThrowable) every file imports via agents/hooks/zod.ts — hooks run before bun install, so it is a committed bundle built from the pinned packages"
run = "bun scripts/vendor-deps.ts"

[tasks."vendor:deps:check"]
dir = "{{config_root}}"
description = "Fail when the committed zod bundle is not what the pinned packages build to (run vendor:deps and commit)"
run = "bun scripts/vendor-deps.ts --check"

[tasks."lint:bun"]
dir = "{{config_root}}"
description = "Enforce the writing-bun-scripts floor over every tracked production Bun CLI"
run = "bun scripts/lint-bun.ts"

# oxlint over the repo's own TS (config: .oxlintrc.json). Default correctness rules everywhere
# tracked except agents/skills/** (vendored templates), plus the house syntax ban on EVERY
# audited *.ts, with NO per-file opt-out and NO disable comment of any kind: `switch` and nested
# ternaries -> ts-pattern (where the file may import it) or an if/else chain/lookup table;
# try/catch -> neverthrow's fromThrowable/fromAsyncThrowable where the file already imports it,
# else agents/hooks/attempt.ts (Promise.try, zero-dep — importable even from a hook or bootstrap
# script that runs before `mise run deps` restores node_modules), or, inside a self-contained
# agents/skills/** skill, an inline `Promise.try(fn).then(ok, err)` rather than crossing the
# skill boundary. try/finally is banned too: cleanup goes through using / await using /
# DisposableStack or promise.finally(), so the tree has no `try` at all.
# Same mechanism as Coral-dpp's .oxlintrc.json:
# oxlint's native rules cannot ban a syntax SHAPE, but the oxlint-plugin-eslint JS plugin carries
# ESLint's no-restricted-syntax with esquery selectors. This replaced the hand-rolled oxc-parser
# walker scripts/lint-no-try-catch.ts (2026-09-12), whose reason to exist was "oxlint cannot
# express this" — true of the native rules, false once jsPlugins landed.
# NO OVERRIDES, NO OPT-OUT: an earlier draft scoped the try/catch ban to scripts/*.ts only (the
# one place the graduation project, package.json, made neverthrow importable) and let
# render-claude-settings.ts opt out IN-FILE via `/* oxlint-disable ... */`, since oxlint 1.82's
# overrides.files has no working exclusion glob (a `!path` entry matches every OTHER file
# instead, verified 2026-09-12). agents/hooks/attempt.ts closed that gap — every audited file now
# has a dependency-free route to the ban's replacement — so both the scoping and the opt-out are
# retired: audit targets get no exception rules, and there is no escape hatch
# (`oxlint-disable`/`oxlint-disable-next-line`, in any form) anywhere in this repo's TS.
# ALSO repo-wide (hooks included — nesting needs no import): `max-depth` 2, oxlint-native.
# The `if { if { if } }` shape a ts-pattern ban cannot reach. WARN, not error, because the
# measured backlog on 2026-09-12 was 103 sites in 16 house files (26 at depth 3); ratchet to
# "error" once that backlog is paid down — a warn that never becomes an error is theater.
#
# TRUST-BOUNDARY BANS (2026-10-03, writing-typescript's "zod safeParse over hand-written type
# guards", made a machine floor because prose was not enough): on EVERY audited file a hand-written
# `x is T` guard, `"key" in value` probing, an `as` cast (`as const` allowed), `<T>value`, and a
# JSON.parse that is not the body of `(): unknown => JSON.parse(..)` are errors, and the
# type-aware `typescript/no-unsafe-*` + `no-explicit-any` rules are errors, so an annotation on a
# JSON.parse() or any other `any` flowing into a typed slot fails too. `--type-aware` is
# REQUIRED here: without it oxlint skips the no-unsafe-* rules silently (verified 2026-10-03) —
# an implicit gap. It needs oxlint-tsgolint (devDependency, pinned beside oxlint) and costs ~0.8 s.
# The rules landed with a measured backlog of 1534 errors in 105 files, all converted the same
# day (2026-10-03) — including the HOOKS, which are live gates and zero-dependency, so they read
# their payload through agents/hooks/narrow.ts instead of zod. There is no ledger and no standing
# exception: lint:ts-ratchet (below) fails if `.oxlintrc.json` carries any `overrides`. A file
# that breaks a rule is converted, never listed. The one structural exclusion is the symlink
# agents/claude/hooks/repo-retrieve.ts in `ignorePatterns` (oxlint resolves its imports at the
# link path and reports false errors; the real file is linted at its own path — same reason as
# tsconfig.json's exclude).
[tasks."lint:ts"]
dir = "{{config_root}}"
description = "oxlint --type-aware the repo's TS against .oxlintrc.json, generated from oxlint-policy.toml: every rule an error (no warn level), no override, no disable comment"
# These CLI wrappers have Node shebangs; run them with the Bun runtime declared above.
depends = ["lint:ts-no-disable"]
run = "bunx --bun oxlint --type-aware"

# The ratchet, at its floor. It began as the shrink-only guard on a ledger of files exempt from the
# trust-boundary rules (it failed when a listed file was already clean). The ledger is gone, and a
# ratchet at zero makes any entry an increase, so it now fails when `.oxlintrc.json` carries ANY
# `overrides`: the lint-side twin of lint:ts-no-disable, which forbids the comment form.
[tasks."lint:ts-ratchet"]
dir = "{{config_root}}"
description = "Fail when .oxlintrc.json carries any `overrides`: the debt ledger was paid to zero on 2026-10-03 and there is no standing lint exception (a file that breaks a rule is converted, not listed)"
run = "bun scripts/lint-ts-ratchet.ts"

# oxlint has no rule that forbids its own suppression comments, so this does: any oxlint-disable
# or eslint-disable in tracked TS fails (audit targets get no exception rules — enforced, not
# promised). A hit prints its file:line.
[tasks."lint:ts-no-disable"]
dir = "{{config_root}}"
description = "Fail on any oxlint-disable / eslint-disable comment in tracked TS (no lint exceptions)"
run = "bun scripts/lint-ts-no-disable.ts"

# Type-check (tsconfig.json). Bun transpiles and never type-checks, so this task is the ONLY
# place the strict flags bite. Same command and name as Coral-dpp's task. In `lint`'s depends
# since 2026-09-12, the day the flags landed: the 203-error backlog they exposed was paid down
# the same day (10 file units, each fix adversarially reviewed) rather than parked as a warning
# — the flags were never lowered, and must not be.
[tasks.typecheck]
alias = "tc"
dir = "{{config_root}}"
description = "Type-check the repo's own TS with tsgo (tsconfig.json: Coral-dpp-strict incl. noUncheckedIndexedAccess / exactOptionalPropertyTypes)"
run = "bunx --bun tsgo --noEmit"

[tasks.test]
alias = "t"
description = "Test the repo: hooks, resource control, repo-retrieve, Bun script floor, skills, zsh terminal hygiene, and toolchain scope"
depends = ["test:hooks", "test:resource-control", "test:agent-dispatch", "test:scripts", "test:skills", "test:android", "test:zsh", "test:mise-scope"]

[tasks."test:android"]
dir = "{{config_root}}"
description = "Offline safety checks for the Pixel LINE-only vibration policy parser"
run = "bun test android/line-notifications.test.ts"

[tasks."test:hooks"]
dir = "{{config_root}}"
description = "Claude Code, Codex, vendor-neutral, and Goal Kernel hook tests (bun test; synthetic payloads exercise real adapters) — includes the hooks.toml registry and wiring"
run = "bun test agents/hooks agents/claude/hooks agents/codex/hooks agents/goal-kernel scripts/tests/hook-registry.test.ts"

# Launcher, not a bare `bun test`: the receipt integration test must run INSIDE the runner's own
# admission envelope, and deciding whether this machine can admit is control flow — which the
# wiring-mise-tasks contract keeps out of TOML bodies. The why and the measurement live in the
# script's header.
[tasks."test:resource-control"]
dir = "{{config_root}}"
description = "Bounded resource admission and explicit Serena lifecycle tests (wrapped in the runner's own envelope where a user systemd can admit it)"
run = "bun ~/dotfiles/scripts/test-resource-control.ts"

[tasks."test:retrieval-control"]
dir = "{{config_root}}"
description = "repo-retrieve route and CLI contract tests (fake ccc/rg executables); also run by test:scripts via tools/*/tests"
run = "bun test tools/repo-retrieve/tests"

[tasks."test:agent-dispatch"]
dir = "{{config_root}}"
description = "agent-dispatch (the one worker entry point) tests: fake agent-dispatch, fake Jev, scratch state dir"
run = "bun test tools/agent-dispatch/tests"

[tasks."test:skills"]
dir = "{{config_root}}"
description = "Run the tests shipped with all agent skills"
run = "bun test agents/skills"

[tasks."test:scripts"]
dir = "{{config_root}}"
description = "This repo's own script tests (scripts/tests) and their proof-of-fire fixtures, plus every tools/*/tests suite"
run = "bun test scripts/tests tools/*/tests"

# The one non-Bun test suite, and deliberately so: it exercises zsh functions whose behaviour is
# defined by tty-ness, a zle precmd hook and raw DEC escapes, via a real pty from `zsh/zpty`.
# Bun has no pty, so a Bun test cannot reach those branches at all.
[tasks."test:zsh"]
description = "Terminal-state hygiene regression tests (real pty via zsh/zpty; the timeout IS an assertion — one guarded regression is a hang)"
run = 'bun ~/dotfiles/scripts/test-zsh.ts'

# The machine enforcement of INV-6 (no implicit global toolchain — see zsh/zshenv). zsh again,
# and again deliberately: the unit under test is a startup file whose behaviour is a function of
# shell mode (`-o interactive`) and inherited PATH, and its last case needs a real login tty.
# The timeout is an assertion here too — that last case boots the user's whole login chain.
[tasks."test:mise-scope"]
description = "Toolchain-scope regression tests (INV-6): the mise shim dir reaches non-interactive shells only, no global default version, no second version manager on login"
run = 'bun ~/dotfiles/scripts/test-mise-scope.ts'

# CI aggregate (wiring-mise-tasks contract). lint:prose is deliberately excluded, same as
# lint.depends: dotfiles has no reports/memos to scan (they live in research repos).
[tasks.check]
alias = "c"
description = "全gate集約 (CI): fmt:check + lint + test"
depends = ["fmt:check", "lint", "test"]

# Device policy tasks are intentionally outside the CI aggregate: a connected, authorized
# Pixel is required. `android:line:check` is a live-device audit, not a source-code gate.
[tasks."android:line"]
dir = "{{config_root}}"
description = "Reapply the safe ADB settings for LINE-only vibration after the dedicated Android Mode is configured"
run = "bun android/line-notifications.ts --apply"

[tasks."android:line:check"]
dir = "{{config_root}}"
description = "Audit the live Pixel LINE-only vibration and lock-screen privacy policy (read-only)"
run = "bun android/line-notifications.ts"

# NOTE: deliberately NOT in `[tasks.lint].depends` — dotfiles has no reports/memos/
# proposals to scan (they live in research repos), so wiring it into the blocking gate
# would add friction with no target. Portable: run it against real files with `-- <paths>`.
# Machine floor = textlint presets (agents/skills/linting-prose/references/machine-floor.md); the
# hand-maintained scripts/check-prose-grounding.sh was RETIRED in the linting-prose reforge (2026-07-04).
# PREREQ (once, GLOBAL): `bun add -g textlint textlint-rule-preset-ja-technical-writing
# @textlint-ja/textlint-rule-preset-ai-writing textlint-rule-prh` — verified: after a global install
# both `bunx textlint` and `textlint` resolve the presets from ANY cwd, so no per-repo `bun add -d`.
# (CI / fresh machines need their own install; for reproducibility a repo may still `bun add -d` + lock.)
# External-register docs (外賓/社外/顧客): swap in assets/textlintrc-external.json (adds the C9 set).
[tasks."lint:prose"]
dir = "{{config_root}}"
description = "Prose lint (linting-prose machine floor): bunx textlint with the house config. Pass paths: `mise run lint:prose -- report.md docs/`. External register → textlintrc-external.json."
run = "bunx textlint --config agents/skills/linting-prose/assets/textlintrc.json"

# ── git hooks ────────────────────────────────────────────────────────────────────────────────
# 規律: .githooks/<event> は `mise run --jobs 1 hook:<event>` を呼ぶだけの薄い殻。git の各 hook で
# 何が走るかは、この mise.toml だけ見れば分かる(一元管理)。
# gate の hook(pre-commit / pre-push)の task は depends のみ・契約 verb のみで、run 本体を持たない —
# 本体は verb から乖離する(2026-09-22: 旧 hook:pre-commit は run に独自 script を持ち、整形だけで
# lint せず、1 日で lint 違反 5 件が入った。整形後の whole-file `git add` は部分 stage の hunk も
# 巻き込んでいた)。event の hook(post-commit / post-merge)は対応する verb が無いので run を持つ。
[tasks."hook:pre-commit"]
description = "The commit gate — exactly what .githooks/pre-commit runs. Depends-only over contract verbs (wiring-repositories HOOK-1). fmt:staged verifies selected jj snapshot bytes; the Git migration branch formats staged files."
depends = ["fmt:staged", "lint"]

# 配線は tracked な core.hooksPath = .githooks(`git config core.hooksPath .githooks`)。
[tasks."hook:post-commit"]
description = "git post-commit body: warm the cocoindex index incrementally (`ccc index`) so search never pays the update latency. No-op when ccc is absent, when the repo has no .cocoindex_code/, or when the daemon is already [indexing]. Called detached by .githooks/post-commit."
run = 'bun ~/dotfiles/scripts/hook-post-commit.ts'

[tasks."hook:post-merge"]
description = "git post-merge body: after a pull/merge, restore the pinned Bun dependencies (bun install --frozen-lockfile + bun link, = deps), relink dotfiles (link-dots.ts, SAFE mode) then relink skills, so newly-pulled code and config work with no manual step. Idempotent. Called by .githooks/post-merge."
# deps first: a pulled commit that adds a dependency (cli-progress for reclaim:purge, 2026-10-06)
# otherwise fails at import on every box that only pulled. An unchanged lockfile is a no-op.
run = '''
cd "${DOTFILES:-$HOME/dotfiles}"
bun install --frozen-lockfile
bun link
bun "${DOTFILES:-$HOME/dotfiles}/scripts/link-dots.ts"
exec mise run link:skills
'''

# jj migration (2026-10-01, same shape as firedancer): agents never run git here — the project
# .claude/settings.json denies it — and jj runs no Git hooks. The commit and pull entrypoints
# preserve the pre-commit and post-merge hooks; push provides the guarded alpha bookmark push.
[tasks.commit]
description = "jj gated commit: snapshot, run hook:pre-commit with PRECOMMIT_VCS/PATHS_FILE/REV/BASE, commit exactly the named paths, move alpha to @-, optionally --push. mise run commit -- -m '<msg>' [--push] -- <path>..."
run = "bun agents/skills/wiring-mise-tasks/scripts/jj-commit.ts"

[tasks.pull]
description = "jj pull: fetch origin, rebase the working-copy branch onto trunk() (= alpha@origin, jj/config.toml), then run hook:post-merge (relink dotfiles + skills) — what .githooks/post-merge did for git pull."
run = '''
set -e
jj git fetch --remote origin
jj rebase -b @ -d 'trunk()'
mise run hook:post-merge
'''

[tasks.push]
description = "jj push: show alpha@origin..alpha, refuse divergence or conflicts, and push alpha to origin. Use --dry-run to print the list only."
run = "bun agents/skills/wiring-mise-tasks/scripts/jj-push.ts"

# ── reclaim ─────────────────────────────────────────────────────────────────
# Thin task aliases for the disk-reclaim CLI. Target policy, safety checks, and configuration live
# in tools/disk-reclaim/README.md; use `plan` to preview and named `run` commands to act.
[tasks.reclaim]
description = "Run all blind-tier reclamation targets: clean, builds, Rust targets, toolchains, workspaces, scratch, and available system cleanup. Preview with reclaim:audit."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run --tier blind --yes'

[tasks."reclaim:clean"]
description = "Reclaim disk: clear package/tool-manager GLOBAL caches (brew/bun/npm/pnpm/yarn/uv/pip/go/docker/cargo/mise/julia) via each tool's OWN gc/prune command. Safe — only regenerable caches; topgrade --cleanup misses bun, this covers it."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run clean --yes'

[tasks."reclaim:rust"]
dir = "{{config_root}}"
description = "Run disk-reclaim's Rust target cleanup for projects under AUDIT_PROJECTS (~/Workspace): candidates exceed RUST_TARGET_DAYS and have no cargo/rustc process inside. The safety predicate also skips targets containing an on-PATH binary. Use reclaim:audit to preview the plan; this task runs it."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run rust --yes'

[tasks."reclaim:toolchains"]
description = "Run disk-reclaim's toolchain cleanup for old rustup toolchains, vscode-server versions, and superseded Codex/Claude releases. Its safety predicates preserve defaults or pinned toolchains, and current, recent, or live-process releases. Use reclaim:audit to preview the plan; KEEP_DAYS/AUDIT_PROJECTS tune eligibility."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run toolchains --yes'

# The Linux SYSTEM-state half of the 断捨離 pass; reclaim:clean owns the per-user package caches
# and stays sudo-free so it also runs on macOS. Split on WHO OWNS THE BYTES, not on OS.
# Measured on r99 2026-09-07: apt archives 1.6 GB, journal 571 MB, 4 disabled snap revisions
# 388 MB — none of which reclaim:clean touches. The task also encodes the fact that cost us the
# most time that day: freeing guest space does NOT return it to Windows while the distro runs
# (fstrim reported 522.9 GiB trimmed; C: free moved 15.79 -> 15.81 GB). A sparse vhdx compacts
# at shutdown only, and .wslconfig has no storage key — so preventing GROWTH is the whole point.
[tasks."reclaim:system"]
description = "Reclaim disk inside WSL: apt archives, journald, snap disabled revisions, then fstrim. Needs sudo. Per-user package caches are reclaim:clean; freed blocks return to Windows only on `wsl.exe --shutdown`."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run system --yes'

# --same-filesystem is not a nicety on WSL: without it a KONDO_DIR above the mount points walks
# /mnt/c and /mnt/e over the DrvFs bridge — ruinously slow, and it aims a build-artifact deleter
# at the Windows filesystem. The $HOME default happens to be safe; the flag makes it safe by
# construction. Measured on r99 2026-09-08: kondo IS installed (Brewfile + check-tools already
# declare it) — an earlier "absent" reading was `command -v` run as root, whose PATH lacks
# /home/linuxbrew/.linuxbrew/bin. Probe brew tools by absolute path, never by root's PATH.
[tasks."reclaim:pick"]
description = "Clean every project's regenerable build artifacts (node_modules/target/build…) via kondo — INTERACTIVE picker. Set KONDO_OLDER (for example 30d) to narrow candidates; KONDO_DIR changes the root. Blind/agent-safe form: reclaim:builds."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" wrap pick --interactive -- kondo --same-filesystem --older "${KONDO_OLDER:-0d}" ${KONDO_DIR:-$HOME}'

# Why a blind twin of reclaim:pick exists: an interactive task never runs unattended, and that
# is exactly why artifacts accumulate — measured on r99 2026-09-08 with the picker never having
# run: target/ 11.0 GB + .venv/ 7.8 GB + node_modules/ 6.4 GB + build|dist/ 2.7 GB = ~28 GB.
# The safety boundary is the regenerable-build-output allowlist, not project age. By default,
# every project's matching output is a candidate; KONDO_OLDER=30d (or any age) narrows it.
[tasks."reclaim:builds"]
description = "Reclaim every project's regenerable build artifacts (node_modules/target/build…) NON-interactively via kondo -a. Set KONDO_OLDER (for example 30d) to narrow candidates. Regenerable only — any agent may run it blind. Human picker: reclaim:pick."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run builds --yes'

[tasks."reclaim:audit"]
description = "READ-ONLY plan of all reclaim targets. Deletes nothing. Use reclaim:judgment to preview owner-approved Rust target/docs cleanup."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" plan --all'

[tasks."reclaim:judgment"]
description = "READ-ONLY plan for owner-approved cleanup of Rust target/ directories of any age and optional rust-docs components. Skips active cargo/rustc projects and targets containing an on-PATH binary. Use reclaim:judgment:yes to act; disk-reclaim records each action and freed byte in its receipt."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" plan judgment'

[tasks."reclaim:judgment:yes"]
description = "Act on reclaim:judgment's owner-approved Rust target/docs plan: cargo clean eligible targets and remove installed rust-docs components. Per-action freed bytes and command output go to the reclaim receipt."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run judgment --yes'

[tasks."reclaim:purge"]
description = "IRREVERSIBLE: empty EVERY graveyard — rip's AND the XDG trash (~/.local/share/Trash). This is the ONLY step that actually frees disk: both delete by rename, so the bytes stay until purged. Prints every target with sizes and requires typing 'yes'. Non-interactive form: reclaim:purge:yes."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run purge --interactive'

[tasks."reclaim:purge:yes"]
description = "IRREVERSIBLE: reclaim:purge confirmed by argv (--yes) instead of a typed 'yes' — prints every target with sizes, then empties every graveyard; output kept in the reclaim receipt log. Owner's decision 2026-10-07: the human-only gate is removed."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run purge --yes'

# The WINDOWS-HOST half of reclaim, for the C: space WSL leaves that no guest-side task can reach.
# reclaim:clean/builds/system free GUEST bytes; on a sparse vhdx those do not always return to C:
# (fstrim was a measured no-op here). These two target Windows-side bytes invisible from the guest.
# reclaim:host is safe on a live box: the running instance's swap.vhdx is locked, so the OS refuses
# to delete it even if the newest-is-live guess were wrong. reclaim:vhdx is a READ-ONLY PLANNER —
# compaction needs admin (ssh is not elevated) and a stopped distro, so it measures the gap, picks
# the method for this Windows edition (Optimize-VHD on Pro, diskpart on Home), and prints the
# elevated procedure rather than pretending to run what it cannot test.
[tasks."reclaim:host"]
description = "Reclaim Windows-host disk under WSL2 that guest-side tasks cannot: orphaned swap.vhdx (from dead distro instances) and the winget cache. READ-ONLY plan by default; --execute frees. Safe live — the OS locks the running swap. --host is an ssh alias."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" plan host'

[tasks."reclaim:workspaces"]
description = "READ-ONLY plan for fully-pushed, clean jj workspaces that disk-reclaim can safely forget and delete. Use reclaim:workspaces:yes to act."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" plan workspaces'

[tasks."reclaim:workspaces:yes"]
description = "Forget and delete jj workspaces only when disk-reclaim proves their contents are pushed, clean, and unused."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run workspaces --yes'

[tasks."reclaim:scratch"]
description = "READ-ONLY plan for reclaimable dead-session scratch directories. Use reclaim:scratch:yes to act."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" plan scratch'

[tasks."reclaim:scratch:yes"]
description = "Delete dead-session scratch directories only when disk-reclaim proves them safe."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" run scratch --yes'

# Remediation for what wsl:audit reports as "host process past 3600s CPU". Twice on r99 (2026-09-09
# and 2026-09-22) sshd left per-connection `sshd -R` processes busy-looping after C: filled — 9 of
# them at ~58,000 s CPU each the second time. Selection is STRUCTURAL, never CPU time: a live
# session always has a `sshd -z` child and a socket, an orphan has neither, and a days-long herdr
# session legitimately accumulates CPU. Plan by default; --execute stops only pids whose creation
# time still matches the plan, so a pid reused by a new live session is left alone.
[tasks."wsl:reap"]
description = "Reap ORPHANED sshd on the Windows host: the per-connection `-R` process (sshd.exe on 9.x, sshd-session.exe on 10.x) under any sshd service with NO child and NO socket (a live session always has both). READ-ONLY plan by default; --execute stops them, pid+creation-time matched. CPU time is reported, never the criterion. --host is an ssh alias."
run = 'bun ~/dotfiles/scripts/wsl-reap.ts'

[tasks."reclaim:vhdx"]
description = "READ-ONLY: plan the offline compaction of a WSL2 ext4.vhdx — usually the largest single C: lever. Measures the allocated-vs-guest-used gap FRESH (it shrinks as the guest writes: 130GB on r99 2026-09-17 was 57GB by 09-21, so never quote a remembered number), detects Optimize-VHD (Pro) vs diskpart (Home), prints the elevated procedure. fstrim and --set-sparse were measured inert here; only compaction returns the gap."
raw = true
run = 'bun "${MISE_PROJECT_ROOT}/tools/disk-reclaim/src/reclaim.ts" plan vhdx'

[tasks."install:tools"]
description = "Install the full CLI toolbox (single source: Brewfile)"
run = 'brew bundle --file=~/dotfiles/Brewfile'

# `bun link` after the install: package.json's `bin` entries (agent-resource-run, disk-reclaim,
# storage-headroom, statusline, serena-foreground, repo-retrieve) are this repo's PATH commands,
# and `bun link` is what turns a `bin` entry into a symlink in bun's global bin dir (~/.bun/bin,
# on every shell's PATH via
# zsh/zshenv). Before 2026-09-13 link-dots.sh hand-symlinked the .ts files into ~/.local/bin —
# a re-implementation of exactly this mechanism, minus the declaration that made their shebangs
# legitimate. Idempotent: re-linking an already-linked package is a no-op.
[tasks.deps]
description = "Restore the repo's pinned Bun dependencies from bun.lock and `bun link` its bin commands into ~/.bun/bin (writing-bun-scripts BG3 graduation project; node_modules is gitignored). Required before running repo .ts scripts on a fresh clone."
run = "bun install --frozen-lockfile && bun link"

# AI coding-agent CLIs, each through its vendor's own SELF-UPDATING installer — never bun/npm.
# An npm-installed claude self-updates by shelling out to `npm view`, and on a box where npm has
# no global version (INV-6: a toolchain exists only where a config declares it) that dies as
# "Unable to fetch latest version from npm registry" while the registry answers 200. That is how
# topgrade's Claude Code step failed on r99 and not on the Mac (native since install) until
# 2026-09-23. Both installers work on macOS and Linux, and they are the channels topgrade's
# `claude_code` and "Codex CLI (standalone)" steps update. gemini-cli dropped: Gemini is reached
# through agy (driving-antigravity). Standalone: not wired into mac:init/wsl:init.
[tasks."install:ai-clis"]
description = "Install the AI coding-agent CLIs through each vendor's self-updating installer: Claude Code native (claude.ai/install.sh), Codex standalone (chatgpt.com/codex/install.sh). Never bun/npm — an npm claude cannot self-update where npm has no global version."
run = [
  "curl -fsSL https://claude.ai/install.sh | bash",
  "curl -fsSL https://chatgpt.com/codex/install.sh | sh",
]

[tasks."mac:init"]
description = "Initialize Mac environment (all-in-one setup)"
# An ordered list, not a script: each step is one command or one task, run in sequence. No
# logic lives here, so the body rule (<= 10 lines, no branching) holds by construction.
run = [
  "brew install sheldon coreutils",
  "brew bundle --file=~/dotfiles/Brewfile",
  { task = "mac:rosetta" },
  { task = "deps" }, # before link:dots — scripts/link-dots.ts imports Cleye from node_modules
  { task = "link:dots" },
  { task = "link:skills" },
  { task = "tmux:plugins" },
  { task = "mac:defaults" },
  { task = "mac:obsidian" },
  { task = "mac:iterm2" },
  "echo '---'; echo 'Setup complete. Run: exec zsh'",
]

[tasks."mac:defaults"]
description = "Apply declarative macOS system defaults (single source: macos/defaults.ts)"
run = 'bun ~/dotfiles/macos/defaults.ts'

[tasks."mac:obsidian"]
description = "Bring every registered Obsidian vault in line with obsidian/: merge app.json keys, install + enable sha256-pinned plugins.json"
run = 'bun ~/dotfiles/obsidian/apply.ts'

[tasks."mac:obsidian:trust"]
description = "Turn Obsidian's Restricted mode OFF for every registered vault so the plugins mac:obsidian installs load. RESTARTS Obsidian (it sets the switch through a one-shot DevTools port, then relaunches without it)"
run = 'bun ~/dotfiles/obsidian/trust.ts'

[tasks."mac:iterm2"]
description = "Point iTerm2 at dotfiles/iterm2/ as its preferences folder (single source: iterm2/setup.sh)"
run = 'bash ~/dotfiles/iterm2/setup.sh'

[tasks."edge:policy"]
description = "Deploy edge/policy.plist.mac as Microsoft Edge's managed policy (/Library/Managed Preferences, sudo): blocks the extension that hijacked the default search and pins the engine. --check compares only (no sudo). macOS only."
run = 'bun ~/dotfiles/scripts/edge-policy.ts'

[tasks."mac:rosetta"]
description = "Install Rosetta 2 on Apple Silicon (idempotent no-op on Intel or if already installed)"
run = 'bun ~/dotfiles/scripts/mac-rosetta.ts'

# ── 横断監査 ──────────────────────────────────────────────────────────────
# 各 repo は自分の check の中で lint:scaffold を持つべきだが、それは「誰かが配線を
# 憶えていた repo」しか覆えない。立ち上げ直後の repo が漏れるのはそこである。
# この sweep は ~/Workspace 直下の git repo を全部 enumerate するので、新しい repo は
# 作られた瞬間から対象になる — 誰も何も憶えていなくてよい。
#
# dotfiles 自身の `lint` には入れない。他 repo の状態で dotfiles の gate が落ちるのは
# 結合の誤りである。強制は各 repo の check が持ち、ここは差分を見るための眺めに徹する。
[tasks."repos:audit"]
description = "~/Workspace の全 git repo の配線健全性を一望する (scaffolding-repositories の floor を横断実行)"
run = 'bun ~/dotfiles/scripts/repos-audit.ts'

[tasks."link:dots"]
description = "Create dotfile symlinks (OS-aware; single source: scripts/link-dots.ts)"
run = 'bun ~/dotfiles/scripts/link-dots.ts --force'

[tasks."tmux:plugins"]
description = "Install tmux plugins via TPM (non-interactive; run after link-dots)"
run = 'bun ~/dotfiles/scripts/tmux-plugins.ts'

# Renamed from check:tools (2026-09-09): "check:" is the reserved CI-aggregate verb namespace
# (mise run check = fmt:check + lint + test) and this task was never part of it — read-only,
# no gate, no exit-1 path. `tools:` here matches the existing audit-verb idiom (reclaim:audit,
# repos:audit): report evidence, human decides.
[tasks."tools:audit"]
description = "Audit recommended tools against the Brewfile (single source: scripts/check-tools.sh; install missing ones via Brewfile)"
run = 'bash ~/dotfiles/scripts/check-tools.sh'

[tasks.doctor]
description = "READ-ONLY: does this machine realize what the dotfiles declare? Links, rendered settings, skills wiring, Brewfile, pinned deps, PATH bins, git hooks, login shell, INV-6, MCP registrations, the smart-open ssh forward, the Edge managed policy, and the per-OS pieces — one PASS/FAIL/WARN/SKIP line each, with the repairing command on every FAIL. DOCTOR_ONLY=links,bins to narrow."
run = 'bun ~/dotfiles/scripts/doctor.ts'

[tasks."secrets:push"]
description = "Push this machine's fnox secrets (TYPESAFE_API_KEY) to an ssh host, age-encrypted, and prove they open there. Use --rotate to update secrets in an existing config written by this script. Only to a box whose root you trust (a rented box of your own, R99) — not a shared server. Usage: mise run secrets:push -- <host> [--rotate]"
run = 'bun ~/dotfiles/scripts/secrets-push.ts'

[tasks."auth:push"]
dir = "{{config_root}}"
description = "Transfer this machine's Codex, Claude Code, and GitHub CLI logins over SSH stdin to an owner's disposable box. Usage: mise run auth:push -- <host> [--only codex,claude,gh] [--force]"
run = "bun scripts/auth-push.ts"

[tasks."doctor:remote"]
description = "From the machine you sit at: is an ssh host usable as dotfiles promises? Key reach, the core CLIs on `ssh host cmd` (herdr --remote's bridge), an interactive login AND a herdr pane landing in zsh with the aliases, and the smart-open forward binding on attach — PASS/FAIL/WARN/SKIP with the fix. Usage: mise run doctor:remote -- <host>"
run = 'bun ~/dotfiles/scripts/doctor-remote.ts'

# FLAGGED 2026-09-09, not yet acted on: unlike check:tools (renamed to tools:audit, above),
# this one genuinely exits nonzero on failure (verified: currently FAILs for real — a retired
# model entry mismarked 'deprecated' — checked_out=1) and reads as a lint-tier floor by its own
# description ("SSOT floor"), yet it is in neither `lint.depends` nor `check.depends`. Left as
# `check:` for now pending a decision: rename to `lint:models` + wire into `lint`, or keep it a
# standalone tool a human runs on purpose. Do not "fix" by silently wiring it in — the pass/fail
# flip is a real CI-behavior change, not a naming one.
[tasks."models:audit"]
description = "Model-release SSOT floor (agents/models/releases.toml): staleness, retirements, dead refs"
run = 'bun ~/dotfiles/agents/models/check-releases.ts'

# A throwaway Linux box (rented GPU container, fresh VM): run scripts/bootstrap-linux.sh as root
# (it ends by calling this as the target user), or run it bare where there is no root (sol).
# Only Brewfile.core, downloaded by mise; no Homebrew, no systemd.
[tasks."linux:init"]
description = "Core dev utilities for a throwaway Linux box (experiment toolchains stay with each repo's mise.toml): Brewfile.core via mise prebuilt releases into ~/.local/bin (root or not), agent CLIs, dotfile links. For an owner's disposable Vast container only, pass --rented to declare agent-dispatch isolation when measured checks pass; never use on a shared server. Entry point from scratch: curl …/scripts/bootstrap-linux.sh | bash as root; without root see the scripts/linux-init.ts header. Check from your machine: mise run doctor:remote -- <host>"
run = "bun ~/dotfiles/scripts/linux-init.ts"

# Run FROM THE MAC after a rental is reachable. Renting itself (offer, cap, tier) stays a judgment.
[tasks."box:init"]
description = "From the Mac, once a rented box answers ssh (or with --root-host/--root-port to bootstrap it as root): bring it to 'experiments can resume' — reach, gh login (--gh), per --repo: clone, mise trust+install, jj (setup:jj or colocate), setup, doctor — then doctor:remote. Idempotent: a finished box re-runs as fast PASS no-ops. Usage: mise run box:init -- <alias> [--root-host H --root-port P] [--gh] [--repo owner/name …]"
run = 'bun ~/dotfiles/scripts/box-init.ts'

[tasks."wsl:init"]
description = "Initialize WSL environment (after: install linuxbrew, brew install mise)"
run = 'bun ~/dotfiles/scripts/wsl-init.ts'

# The ONE Windows-side file this repo owns, and the only one it cannot symlink: %USERPROFILE%\
# .wslconfig is read by the Windows WSL service, which does not follow symlinks made inside WSL.
# So it is copied, and drift is REPORTED rather than silently overwritten. Second
# generated-not-linked exception in this repo, after ~/.claude/settings.json.
# Guarded: refuses to deploy a memory= that would leave Windows under ~6 GB on this host, since
# an over-committed memory=60GB on a 63.9 GB box measurably destabilised it on 2026-09-06.
[tasks."wsl:wslconfig"]
description = "Deploy wsl/wslconfig.win to %USERPROFILE%\\.wslconfig (COPY — Windows cannot follow a WSL symlink). Idempotent, backs up drift, guards memory= against host RAM. Needs `wsl --shutdown` to take effect."
run = 'bun ~/dotfiles/scripts/wsl-wslconfig.ts'

# Start WSL on a Windows host parked at its LOGON SCREEN — the thing that actually fixes the
# "Windows Update rebooted overnight and the box was unreachable for 5 hours" failure.
#
# The obvious fix looked like auto-logon, because WSL-keepalive and WSL-revive are onlogon tasks.
# That was a means mistaken for the goal, and it cost a long detour (Sysinternals Autologon in two
# builds, LsaStorePrivateData by P/Invoke, AutoLogonSID removal — none of which logs in a
# MicrosoftAccount that has Windows Hello configured). Measured 2026-09-12: `wsl.exe` over ssh
# starts the distro at the logon screen anyway, exit 0. The onlogon limit is Task Scheduler's,
# not WSL's. Reaches the host over TWO routes tried in order: r99-lan (LAN/mDNS) for the logon
# screen where Windows Tailscale — a user-session GUI client — is down; then r99 (tailnet) for
# everywhere else, including off-LAN, where mDNS will not resolve. A single hardcoded route failed
# off-subnet on 2026-09-17. It also ENSURES the guest is reachable, not merely that the distro is
# Running: the distro can be up while ssh.service inside WSL is not (measured same day), so it
# starts sshd through the host and re-checks.
[tasks."wsl:wake"]
description = "Start WSL and leave the guest ssh-reachable — for when Windows rebooted to the logon screen or the distro idle-terminated. Tries the LAN alias then the tailnet alias, holds the distro up with a detached anchor, then verifies the guest and starts its sshd if needed. --status to only report; --host to pin one route."
run = 'bun ~/dotfiles/scripts/wsl-wake.ts'

# READ-ONLY resource evidence, both halves at once. It is the second half that carries the
# signal: every r99 outage this repo debugged was INVISIBLE from inside the guest — C: at 1.08 MB
# free while the guest read 38% used (the vhdx max, 1007 GB, is larger than C: itself, 931 GB);
# 7 spinning host processes holding 6.8 of 16 cores for 3 days with guest loadavg and PSI flat;
# NvContainer crash-looping every 8s for 3 days. A guest-only monitor calls all three healthy.
# Runs from the Mac (both legs over ssh) or inside the distro (--guest local --host local, which
# reaches Windows through interop powershell.exe). Exit 0 clear / 1 threshold breached /
# 2 could not measure — "I could not see" is never folded into "I saw a problem".
[tasks."wsl:audit"]
description = "READ-ONLY resource evidence for the WSL2 guest AND the Windows host under it, in one shot, with a threshold verdict (CPU/PSI, memory, swap, guest disk, C:, vmmemWSL, spinning processes, service crashes, vhdx allocated-vs-apparent). Deletes nothing. --json for machine use; --guest/--host take ssh aliases or 'local'."
run = 'bun ~/dotfiles/scripts/wsl-audit.ts'

# The Windows half of the Brewfile. Brewfile is the single source of truth for tools on macOS and
# WSL; the Windows host underneath had none — 113 winget-managed packages (2026-09-11) lived only
# on the machine. `winget export` / `winget import` give the same source-of-truth shape, so the
# tracked file is wsl/winget.win.json and these two verbs are the plumbing. dump and restore are each
# one-way (host -> repo, repo -> host); drift is a git diff after dump, never a silent merge.
# Coverage limit, by winget's contract: only packages a source can resolve are exported (96 of
# 113 here). The NVIDIA display driver is NOT in winget; CUDA is.
[tasks."wsl:winget:dump"]
description = "Capture the Windows host's winget-managed packages into wsl/winget.win.json (winget export via interop, ids sorted for stable diffs). Review the diff, then commit."
run = 'bun ~/dotfiles/scripts/wsl-winget.ts dump'

[tasks."wsl:winget:restore"]
description = "Install everything wsl/winget.win.json lists that is missing on the Windows host (winget import --no-upgrade --ignore-unavailable). --dry-run prints the command only."
run = 'bun ~/dotfiles/scripts/wsl-winget.ts restore'

[tasks."bench:definitions"]
description = "Yardstick for `rr exists`: top-1/3/10 per language and absence on a case file kept OUTSIDE this public repo (it names private code). mise run bench:definitions -- --cases ~/.local/share/repo-retrieve/bench/<name>.json"
run = "bun tools/repo-retrieve/src/bench-definitions.ts"

[tasks."wsl:rerank"]
description = "Enable the socket-activated reranker for `rr exists` (link:dots places the units). Idempotent; the service itself starts on the first query and exits after 30 idle minutes."
run = 'systemctl --user daemon-reload && systemctl --user enable --now repo-retrieve-rerank.socket && systemctl --user is-active repo-retrieve-rerank.socket'

[tasks."wsl:ccc-daemon"]
description = "Hand the ccc daemon to systemd with CPU/RAM caps (link:dots must have run first)"
# Two-step by design, like cc:install-mcp: link:dots places the unit, this activates it.
# Stop the incumbent first — a fresh daemon unlinks and rebinds the socket at startup, so
# skipping this leaves the old uncapped process alive and orphaned from its socket.
run = 'bun ~/dotfiles/scripts/wsl-ccc-daemon.ts'

[tasks."wsl:capacity:enable"]
description = "Enable the session-independent WSL C: recovery timer (link:dots must have run first)"
run = 'systemctl --user daemon-reload && systemctl --user enable --now wsl-capacity-recover.timer'

[tasks."wsl:fix-gitexe"]
description = "Allow Windows git.exe to trust the WSL repo path"
# Derive the UNC path (wslpath knows the distro AND the user); the old literal baked in a stale
# distro (Ubuntu-22.04) and the WINDOWS username as if it were the Linux one — wrong on both axes.
run = '''
command -v git.exe >/dev/null 2>&1 || { echo "git.exe not on PATH (Windows git not installed?)"; exit 1; }
unc=$(wslpath -w "$PWD" | tr '\\' '/')   # \\wsl.localhost\<distro>\home\<user>\dotfiles → //…
git.exe config --global --add safe.directory "%(prefix)/$unc"
echo "trusted: %(prefix)/$unc"
'''

[tasks."install:rust"]
description = "Install Rust toolchain"
run = 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh'

[tasks."cc:install-mcp"]
description = "Apply .mcp.json (single declarative source) to Claude Code (user scope) AND Codex. Idempotent. mac & WSL."
run = 'bun ~/dotfiles/scripts/install-mcp.ts'

[tasks."link:skills"]
description = "Link agents/ commands and skills into AI tools' config directories"
run = 'bun ~/dotfiles/scripts/link-skills.ts'

# Third-party skills. The bare `bunx skills add` is deliberately NOT the documented entrypoint:
# without -g it writes four paths into the current directory, without --skill it installs every
# skill the source repo ships, and `add` overwrites a same-named directory with no prompt — all
# three measured against skills@1.5.22. The wrapper pins the version, forces -g (so the bytes
# land in agents/skills via ~/.agents/skills) and refuses a name this repo already owns.
[tasks."skills:add"]
dir = "{{config_root}}"
description = "Vendor a third-party skill into agents/skills/. Usage: mise run skills:add -- <owner/repo> --skill <name> [--skill <name>…] [--dry-run]"
run = 'bun ~/dotfiles/scripts/vendor-skill.ts'

[tasks."codex:remote-control"]
description = "Converge the Codex app-server daemon's remote control (how the ChatGPT mobile app reaches this machine) to agents/codex/app-server.toml. Idempotent; on drift it persists the setting and restarts a running daemon. `mise run doctor` (codex-remote) reports the drift."
run = "bun agents/codex/codex-remote-control.ts"

[tasks."codex:sandbox-network"]
description = "Converge the declared Codex workspace-write network setting into the Codex-owned ~/.codex/config.toml; `mise run doctor` reports drift."
run = "bun agents/codex/codex-sandbox-network.ts"

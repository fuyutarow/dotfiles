# Mise configuration for dotfiles management

[tasks.up]
description = "Update system packages"
run = '''topgrade --disable containers || echo "Topgrade completed with some errors"'''

[tasks."install:bun_packages"]
run = '''
bun i -g @anthropic/claude-code @openapi/doex @google/gemini-cli
'''

[tasks."mac:init"]
description = "Initialize Mac environment (all-in-one setup)"
run = '''
brew install sheldon coreutils
brew bundle --file=~/dotfiles/Brewfile
mise run mac:link-dots
mise run link:skills
echo "---"
echo "Setup complete. Run: exec zsh"
'''

[tasks."mac:link-dots"]
description = "Create symlinks for Mac dotfiles"
run = '''
mkdir -p ~/.config
ln -sf ~/dotfiles/mac/.zprofile ~
ln -sf ~/dotfiles/mac/.local-gitconfig ~
ln -sf ~/dotfiles/common/.zshrc ~
ln -sf ~/dotfiles/common/sheldon ~/.config/sheldon
ln -sf ~/dotfiles/common/.gitconfig ~
ln -sf ~/dotfiles/common/.tmux.conf ~
# Karabiner (link entire directory)
rm -rf ~/.config/karabiner
ln -sf ~/dotfiles/karabiner ~/.config/karabiner
echo "Dotfiles linked."
'''

[tasks."mac:check-tools"]
description = "Check which recommended tools are installed"
run = '''
echo "Checking recommended tools..."
for tool in bat eza rg fd dust procs btop gping sd choose tldr zoxide broot delta just fzf lazygit lazydocker jq yq direnv starship atuin mcfly navi rip sheldon tmux gh mise; do
  if command -v "$tool" >/dev/null 2>&1; then
    echo "  $tool"
  else
    echo "  $tool"
  fi
done
'''

[tasks."install:rust"]
description = "Install Rust toolchain"
run = 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh'

[tasks."link:skills"]
description = "Link commands directory to AI tools' skills/prompts directories"
run = '''
# Claude Code - commands (skills)
mkdir -p ~/.claude
ln -sfn ~/dotfiles/commands ~/.claude/commands

# Codex - skills
mkdir -p ~/.codex
ln -sfn ~/dotfiles/commands ~/.codex/skills

# Gemini - global_workflows
mkdir -p ~/.gemini/antigravity
ln -sfn ~/dotfiles/commands ~/.gemini/antigravity/global_workflows

echo "✅ Skill links created successfully:"
echo "   ~/.claude/commands -> ~/dotfiles/commands"
echo "   ~/.codex/skills -> ~/dotfiles/commands"
echo "   ~/.gemini/antigravity/global_workflows -> ~/dotfiles/commands"
'''

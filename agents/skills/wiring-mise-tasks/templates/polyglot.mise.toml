# <repo> — mise task runner。未完成の TEMPLATE fragment: そのまま実行用に配らない。
# 文法と動詞契約の正本は
# wiring-mise-tasks/SKILL.md。写しを直すな、正本を直してから配れ。
# 多言語合成の裁定 = wiring-mise-tasks/references/recipes.md §6 (qoed 前例)。
# 各セルの中身は単言語 template から移植し、TeX は compiling-latex の
# latex:* template に委ねて check が latex:check を集約する。
# 検査: bun ~/.claude/skills/wiring-mise-tasks/scripts/mise-contract.ts
# コピー時に runtime を [tools] に宣言し、各 manifest と cwd を実際の配置へ合わせる。
# Cargo と JS の root が同じ場合も、manager ごとの leaf task は分ける。

[tasks.setup]
alias = "i"
description = "dev 一括セットアップ (setup:* を集約)"
depends = ["setup:tools", "setup:julia"]

[tasks."setup:julia"]
description = "Julia 依存を instantiate"
run = "julia --project=. -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'"

[tasks."setup:tools"]
description = "外部 CLI 導入 (brew/bun 前提・冪等)"
run = '''
brew install rumdl
bun install --frozen-lockfile
'''

[tasks.fmt]
alias = "f"
description = "一括フォーマット: 言語別 fmt:* を集約"
depends = ["fmt:julia", "fmt:rust", "fmt:md"]

[tasks."fmt:julia"]
description = "JuliaソースをRunicで整形"
run = "julia --project=. -m Runic --inplace ."

[tasks."fmt:rust"]
description = "Rust (サブ crate) を rustfmt で整形"
run = "cargo fmt --manifest-path harness/Cargo.toml --all"

[tasks."fmt:md"]
description = "Markdownをrumdlで整形 (config = .rumdl.toml)"
run = "rumdl fmt"

[tasks."fmt:check"]
description = "整形チェック (CI用・非破壊): 全言語ぶんを一括"
depends = ["fmt:julia:check", "fmt:rust:check", "fmt:md:check"]

[tasks."fmt:julia:check"]
description = "Julia 整形チェック"
run = "julia --project=. -m Runic --check ."

[tasks."fmt:rust:check"]
description = "Rust 整形チェック"
run = "cargo fmt --manifest-path harness/Cargo.toml --all -- --check"

[tasks."fmt:md:check"]
description = "Markdown 整形チェック"
run = "rumdl check ."

# lint:julia/lint:rust は未配線 — 明記された先送り (recipes.md §1 の tier 裁定:
# 無言の starter はドリフト)。package 化した言語から lint:<lang> を足して集約へ。
[tasks.lint]
alias = "l"
description = "lint 一括: 言語別 lint:* を集約 (現状 md のみ・Julia/Rust は package 化時に昇格)"
depends = ["lint:md"]

[tasks."lint:md"]
description = "Markdown 構造 gate: rumdl check"
run = "rumdl check"

[tasks.test]
alias = "t"
description = "test:* を集約 (この例では Julia のみ。必要な他言語検査を追加する)"
depends = ["test:julia"]

[tasks."test:julia"]
description = "Julia tests"
run = "julia --project=. -e 'using Pkg; Pkg.test()'"

[tasks.up]
alias = "u"
description = "up:* を集約 (この例では Julia のみ。manager ごとの更新も個別に呼べる)"
depends = ["up:julia"]

[tasks."up:julia"]
description = "Julia 依存更新"
run = "julia --project=. -e 'using Pkg; Pkg.update()'"

[tasks.check]
alias = "c"
description = "全gate集約: fmt:check + lint + test (+ 採用した gate は同じ編集で必ずここへ足す)"
depends = ["fmt:check", "lint", "test"]

[tasks."mise:contract"]
description = "筋肉記憶トークン契約の検査 (wiring-mise-tasks gate)。mise.toml 編集後に実行"
run = "bun ~/.claude/skills/wiring-mise-tasks/scripts/mise-contract.ts"

# git の各 hook で何が走るかはここで宣言する。.githooks/<event> は `mise run --jobs 1 hook:<event>`
# だけを実行する shim(形 = wiring-repositories HOOK-1、mise の実行上の注意 = wiring-mise-tasks
# recipes.md §8)。gate の task は契約 verb の depends のみで、run 本体を持たない。
[tasks."hook:pre-commit"]
description = "commit gate — .githooks/pre-commit が走らせるものそのもの。契約 verb の depends のみ"
depends = ["fmt:check", "lint"]

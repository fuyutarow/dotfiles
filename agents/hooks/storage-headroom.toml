# storage-headroom — the declarative half of enforce-storage-headroom.ts.
#
# This file says WHAT is guarded and at what size; the hook says HOW (parsing commands,
# measuring, caching, locating a cargo target dir). Change a number or add a budget here — no
# code edit. The hook validates this file on every non-allowlisted PreToolUse call: an unknown key,
# wrong type, or missing field denies rather than silently falling back to defaults.
# Cleanup and read-only exceptions are enforced by the hook. Contract: storage-headroom.contract.md.

schema = 1
sparse_required_above_mb = 500

# Free space below which a launch is refused (deny) or allowed with a warning (warn). Each line is
# the SMALLER of a size and a share of the drive: min(deny_gib, deny_pct% of the drive's size), and
# the same for warn. Both halves are required. The sizes were set on r99 (C: 931 GB, guest ~1 TB),
# where min() picks them unchanged; on a 40 GB rented box `deny_gib = 40` alone refused every
# launch with the disk 80% empty (2026-10-05), and the share is what scales it down.
# `host` is the Windows drive under WSL2, measured at /mnt/c — skipped where that path does not
# exist (macOS). `guest` is the filesystem at /.
[drive.host]
label = "host C: (WSL vhdx)"
path = "/mnt/c"
# 2026-09-26 00:3x JST, owner ruling: "閾値は20でいいよ". At deny 60 the gate refused every
# experiment with C: at 52 GiB while the guest had 433 GiB free (vhdx blocks freed inside the
# guest are reused before the vhdx grows). Deny new work at 20; stop_gib must stay below deny_gib.
deny_gib = 20
deny_pct = 5
# 2026-10-11, owner ruling: "40 GiB の閾値を 20GiBにして". agent-resource-run refused every
# compute launch at its warn line with C: at 39.8 GiB while the guest had 264 GiB free.
warn_gib = 20
warn_pct = 10
stop_gib = 10
# Display-only time-to-full colours; accepted by the gate but not enforced yet.
rate_red_minutes = 30
rate_yellow_minutes = 120

[drive.guest]
label = "guest /"
path = "/"
deny_gib = 40
deny_pct = 10
rate_red_minutes = 30
rate_yellow_minutes = 120

# Appended to every deny. The agent owns further safe diagnosis if the automatic recovery unit
# cannot restore the floor; neither global trash purge nor stopping WSL is delegated here.
# Measured 2026-09-26 on r99: deleting a 145 GB target/ then `fstrim -v /` returned 148 GB to C:
# at once; without the trim the return is lazy and partial.
[deny]
advice = """\
Free space now: `disk-reclaim run --tier blind --yes` (caches, stale builds, finished-session scratch, fully-pushed jj workspaces — nothing that is not regenerable or already on a remote). Preview: `disk-reclaim plan`.
Owner decisions: `disk-reclaim plan --tier owner` lists what needs a decision (Rust targets of any age, graveyard purge) with sizes. For an approved single path, use `disk-reclaim delete <path> --yes`.
Verify a positive free delta (`disk-reclaim receipts --last 1`) before claiming recovery. Never purge the global Trash or remove research outputs without their retention rule.
rip frees nothing until the graveyard is purged; on overlay filesystems (EXDEV) it copies first. To free space, use `disk-reclaim delete <path> --yes` (vetted delete) or `disk-reclaim run purge --yes`.
STORAGE_ASSERT_OVERRIDE=1 does not bypass the tool-call allowlist or any deny line.
WSL only: after large deletes, `disk-reclaim run system --yes` ends with fstrim so C: gets the blocks back now. If live reclaim cannot free C:, use `disk-reclaim plan vhdx`; offline vhdx compaction requires an idle distro and host admin."""

# Commands that START work that writes bytes. A launch matches `command` at a command position
# (after ; && || | ( then do, and through sudo/env/time/nice/timeout/VAR= prefixes), optionally
# followed by one of `subcommands`. Cleanup and reads (rm, cargo clean, du, df, git) are never
# listed: cleanup must stay possible when the drive is full.
[[launcher]]
command = "systemd-run"

[[launcher]]
command = "agent-resource-run"

[[launcher]]
command = "polysearch"
subcommands = ["run"]

[[launcher]]
command = "julia"

[[launcher]]
command = "cargo"
subcommands = ["build", "test", "run", "bench", "install"]

# mise hides the cargo/julia invocation from the Bash PreToolUse command string. Match only
# build-producing task names; reclaim:* must remain callable when the drive is low.
[[launcher]]
command = "mise"
subcommands = ["run"]
tasks = ["test", "t", "lint", "l", "check", "c", "up", "u", "setup", "i"]

[[launcher]]
command = "m"
tasks = ["test", "t", "lint", "l", "check", "c", "up", "u", "setup", "i"]

# Per-language artifact budgets: when a launch of one of `launchers` is inspected, the artifact
# it grows is sized. `warn_gib` advises cleanup; `deny_gib` blocks another build until cleanup.
# `locate` names how the artifact is found: "path" (the `path` key, ~ expanded) or
# "cargo-target" (CARGO_TARGET_DIR, .cargo/config.toml target-dir, else <workspace>/target,
# following a leading `cd` and --manifest-path — logic that lives in the hook).
[[budget]]
name = "cargo target"
launchers = ["cargo", "mise", "m"]
locate = "cargo-target"
warn_gib = 30
deny_gib = 80
incremental = true
advice = """\
`cargo clean` when no build is running in this tree; otherwise stale session dirs under \
target/*/incremental can go (the next build recompiles those crates). For agent/worktree builds \
set CARGO_INCREMENTAL=0 — incremental sessions are per-build and pile up — and share one \
CARGO_TARGET_DIR across worktrees."""

# Julia's precompile cache keeps one tree per Julia version and per package build; a toolchain
# bump leaves the old version's tree behind. Measured 2026-09-22: 11 GiB for v1.12 alone.
[[budget]]
name = "julia compiled cache"
launchers = ["julia"]
locate = "path"
path = "~/.julia/compiled"
warn_gib = 20
advice = """\
directories for Julia versions no longer installed (`juliaup status`) can go whole; within the \
current version, `using Pkg; Pkg.gc()` drops caches of packages no manifest references."""

# Sizing is `du`, bounded and cached per artifact path (a 100 GiB tree takes seconds to walk,
# and agents launch builds many times an hour).
[measure]
du_timeout_seconds = 20
cache_minutes = 5

# Vendor-neutral hook registry — the hook analogue of agents/skills/.
#
# One source, N agent CLIs: every [[hook]] below is wired into each vendor's DEPLOYED config by
# scripts/render-home.ts (`mise run link:dots`):
#   claude → ~/.claude/settings.json  (from agents/claude/settings.json)
#   codex  → ~/.codex/hooks.json      (from agents/codex/hooks.json)
# beside every hand-written entry. It owns exactly the hook commands that run through
# ~/.agents/hooks/run.sh (agents/hooks, linked by scripts/link-dots.ts); such a command written
# into a committed vendor file is a second writer, and `mise run lint:one-writer` fails on it.
#
# WHAT BELONGS HERE: a hook whose whole protocol surface is shared by the vendors it lists (see
# agents/hooks/lib.ts). A hook that reads a vendor's transcript, a vendor-only tool name, or
# answers "ask" stays in that vendor's own dir (agents/claude/hooks, agents/codex/hooks).
#
# Slug: required, unique kebab-case identity, optionally nested with `:` (for example agx:snapshot),
# used as [<slug>] on every visible message.
# vendor_hook declares vendor-only identities; external lists third-party commands, owner and reason.
# vendor_hook.script is relative to agents/; commands lists its exact hand-written registrations.
# external.command is an exact allowlist match; an unlisted unowned command fails lint:hook-slug.
# Fields: slug, script (file in agents/hooks), event, position (per event, declared, never reused;
# the rendered order follows it, not this list's order), matcher (optional), fail_closed (a policy
# gate must never fail open when bun is missing), timeout (seconds, optional), vendors.
# History: agents/hooks/slots.toml records every position append-only; a new [[hook]] needs a
# [[slot]] above all recorded ones, and only the last position of an event may be retired.

[[hook]]
slug = "storage-headroom"
script = "enforce-storage-headroom.ts"
event = "PreToolUse"
position = 0
fail_closed = true
vendors = ["claude", "codex"]

# Orders to codex / grok / claude / agy must name a model of the CURRENT generation: the floors per
# model family are in model-floor.toml (sol >= 6.1, grok >= 4.7, ...), so a newer generation passes
# without an edit. Both vendors, because a Codex session orders work from grok and claude too.
[[hook]]
slug = "model-floor"
script = "enforce-model-floor.ts"
event = "PreToolUse"
position = 1
matcher = "Bash"
fail_closed = true
vendors = ["claude", "codex"]

[[hook]]
slug = "search-route"
script = "enforce-search-route.ts"
event = "PreToolUse"
position = 2
matcher = "Grep|Bash"
fail_closed = true
vendors = ["claude", "codex"]

# Both vendors: a Bash command may not name a rip graveyard other than the declared one
# (`rip --graveyard X`, `GRAVEYARD=X rip`, …). Owner decision 2026-11-08: the rule lives here, not in
# a PATH shim or zsh function; disk-reclaim covers the graveyards that already exist.
[[hook]]
slug = "graveyard-scope"
script = "enforce-graveyard-scope.ts"
event = "PreToolUse"
position = 3
matcher = "Bash"
fail_closed = true
vendors = ["claude", "codex"]

# Codex only: Claude Code enforces .claude/settings.json permissions.deny itself.
[[hook]]
slug = "repo-bash-deny"
script = "enforce-repo-bash-deny.ts"
event = "PreToolUse"
position = 4
matcher = "Bash"
fail_closed = true
vendors = ["codex"]

# Claude only: remind each submitted prompt of the configured reply language.
[[hook]]
slug = "reply-language-reminder"
script = "remind-reply-language.ts"
event = "UserPromptSubmit"
position = 0
fail_closed = false
vendors = ["claude"]


[[vendor_hook]]
slug = "dispatch-contract"
script = "claude/hooks/enforce-dispatch-contract.ts"
commands = ["sh ~/.claude/hooks/run.sh --fail-closed enforce-dispatch-contract.ts"]

[[vendor_hook]]
slug = "supervised-execution"

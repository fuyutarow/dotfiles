version: 1

# linting-prose EXTERNAL register dict — loaded ONLY by textlintrc-external.json, for documents whose
# declared audience is OUTSIDE the project (外賓 / 社外 / 顧客 / reviewer). These patterns are the C9
# insider-register-export set: internal grammar that is legitimate in internal working docs but must
# NOT reach an external reader. Gated behind the external config so it never false-positives on an
# internal log. Proven to fire on QOED docs/RESEARCH_STATE.md. DETECT-ONLY — the model translates.

rules:
  - expected: "（内部台帳ID — 外部読者には引用形式に直すか削除。provenance は付録へ）"
    pattern: /[A-Z]{1,3}[0-9]{4}_[0-9]{2,3}/
  - expected: "（provenance 行 — 付録の参照か読者の引用形式へ）"
    pattern: /receipt:/
  - expected: "（内部 verdict enum — 一文の結論に展開せよ）"
    pattern: /[A-Z]{3,}_[A-Z_]{3,}/
  - expected: "検証済み（何をどう検証し何が残るかを同一行で明記。裸の PASS は不可）"
    pattern: /\bPASS\b/
  - expected: "実機検証は未実施、と平文で一度述べる"
    pattern: /field.test gated/

schema = 1

# Read by agx (agx ws; manual: `agx ws --help`). `ready` runs, in order, inside each new
# workspace; `trunk` is the revset a change must be reachable from to count as landed.
[ws]
ready = ["mise trust -q", "bun install --frozen-lockfile"]
trunk = "alpha"
# agx ws gc reads this list; only rebuildable tool caches belong here, never worker results.
regenerable = [".rumdl_cache/"]

# Workers run without a sandbox by owner decision (2026-11-26). A ticket that needs one sets
# sandbox = "workspace-write"; a dispatch flag overrides both.
[worker]
sandbox = "none"

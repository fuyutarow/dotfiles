# This repo's additions to the house TypeScript lint policy (presets/typescript/policy.toml).
# It may ADD ignores with reasons, opt into React checks, and add or strengthen rules.
# Render: mise run oxlint:render · drift check: mise run lint:oxlint-policy.
schema = 1
ignore = []

# Optional: enable the house React rules only in these packages.
# react = ["ts/heritage-react/**"]

# Example (firedancer): code kept as a record of what a run executed is not maintained code.
# [[ignore]]
# pattern = "research_record"
# reason = "frozen copies of apparatus code: a run's provenance; rewriting them breaks what the record reproduces"

# Optional: strengthen a rule for ALL files, including test and React overrides.
# [rules]
# "node/no-sync" = "error"

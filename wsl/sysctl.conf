# Kernel tunables for the WSL2 guest.
# Symlinked to /etc/sysctl.d/50-dotfiles.conf by scripts/link-dots.sh (needs root, same guarded
# sudo path as /etc/wsl.conf). systemd-sysctl.service applies /etc/sysctl.d/*.conf at boot, in
# lexical order with later files winning; 50- lands after the distro's own 10-* drop-ins and
# before 99-sysctl.conf, so this file neither shadows a distro default silently nor is shadowed.
# Apply without a reboot: sudo sysctl --system
#
# THE BAR FOR ADDING A LINE HERE: a measurement on this box showing the default is wrong. Every
# knob below cites one. Tunables that "look right" but had no measured problem were REJECTED, and
# the rejections are recorded at the bottom so nobody re-adds them from a blog post.

# --- swappiness: this is a compute box with RAM to spare, so stop volunteering to swap --------
# Measured 2026-09-09 on r99, 1h37m uptime under a real julia + agent workload:
#   Swap:  16Gi total, 0B used   (SwapFree == SwapTotal exactly, SwapCached 0 kB)
#   Mem :  54Gi total, 13Gi used, 41Gi available
#   /proc/pressure/memory total = 85129 ns  (0.085 ms since boot — i.e. nothing ever stalled)
#   OOM kills: 0 in dmesg, 0 in the journal
# The default 60 tells the kernel to swap speculatively even with 41Gi free. On a numerical
# workload that is the wrong trade twice over: paging a hot array out costs orders of magnitude
# more than the page cache it buys, and the swap file is a NON-SPARSE vhdx on C: (verified:
# `fsutil sparse queryflag` -> "NOT set as sparse"), so every page ever swapped permanently
# consumes host disk until the distro restarts — on a drive that hit zero free twice in one week.
#
# 10, not 0: 0 disables swap for anonymous pages almost entirely, which turns a recoverable
# slow patch into an OOM kill. 10 keeps the safety valve while ending speculative paging.
vm.swappiness = 10

# --- REJECTED, with the measurement that rejected each one ------------------------------------
# Do not add these back without a NEW measurement contradicting the one cited.
#
# fs.inotify.max_user_watches — already 524288 (Ubuntu 24.04 default), and only 33 watches were
#     in use across the whole box with ccc, vscode-server and the agent fleet running. The
#     classic "8192 is too low" advice does not apply to this distro.
# fs.file-max / nofile — fs.file-max is effectively unbounded here; the highest open-fd count of
#     any process was 189 (herdr) against a 1024 soft limit, and systemd units already get
#     LimitNOFILESoft=1048576. Nothing is near a ceiling.
# vm.max_map_count — already set to 1048576 by the distro's own /etc/sysctl.d/10-map-count.conf.
#     Setting it here would be a second home for one value, and a silent fight if that file moves.
# vm.vfs_cache_pressure — tempting to lower so dentry/inode cache survives longer, but the
#     constrained resource on this machine is HOST RAM, not guest cache hit rate: the Windows
#     side was measured at 1.83 GB free while vmmemWSL held 44.96 GB. Holding MORE cache in the
#     guest pushes the wrong direction, and WSL's own autoMemoryReclaim (default dropCache)
#     already owns this decision.
# net.core.rmem_max / wmem_max — the remote-TUI latency work looked like a TCP window problem and
#     was not: 4 parallel streams measured SLOWER than one (0.48 vs 0.72 MB/s), which is a
#     saturated link, not a window ceiling. Bigger buffers would have bought nothing. The fix
#     that did work was sending fewer bytes (ssh Compression — see ssh/config).

# ============================================================
# tmux/clipboard.conf — cross-platform clipboard / true-color / URL
# Sourced by tmux.conf. OS variance lives HERE (topic-first), branched at
# RUNTIME the same way zsh/aliases.zsh sources zsh/mac.zsh / zsh/wsl.zsh.
#
# Layered design:
#   (1) OSC 52 (set-clipboard on) — terminal-native, works over SSH, copy-only.
#   (2) per-OS backend fallback    — for terminals that drop OSC 52, and for PASTE.
# tmux-yank (if installed) auto-detects pbcopy/clip.exe/wl-copy/xclip and will
# OVERRIDE the copy binds below; on WSL it needs @override_copy_command to keep
# the iconv->UTF-16 fix (set in tmux.conf plugin block). These binds are the
# robust pre-plugin fallback.
# ============================================================

# --- true color + clipboard terminal capabilities ---------------------------
# RGB covers every outer terminal (the old "*256col*:Tc" glob missed kitty/ghostty/wezterm).
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:clipboard"

# --- OSC 52: push copies to the system clipboard, including over SSH (copy-only) ---
set -s set-clipboard on

# --- vim/nvim autoread + correct cursor shape inside tmux -------------------
set -g focus-events on

# ===========================================================================
# COPY / PASTE / OPEN backends — branched by OS (conditions are mutually exclusive)
# ===========================================================================

# ---- macOS ----------------------------------------------------------------
if-shell '[ "$(uname -s)" = Darwin ]' {
    bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel 'pbcopy'
    bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel 'pbcopy'
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
    bind -T root MouseDown2Pane run 'pbpaste | tmux load-buffer - && tmux paste-buffer'
    bind u run -b 'u=$(tmux capture-pane -Jp | grep -oE "https?://[^[:space:]]+" | tail -1); [ -n "$u" ] && open "$u"'
}

# ---- WSL (Windows interop present) -----------------------------------------
# iconv -> UTF-16LE keeps Japanese / emoji intact through clip.exe.
if-shell 'command -v clip.exe >/dev/null 2>&1' {
    bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel 'iconv -t utf-16le | clip.exe'
    bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel 'iconv -t utf-16le | clip.exe'
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'iconv -t utf-16le | clip.exe'
    bind -T root MouseDown2Pane run 'powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; Get-Clipboard" | sed "s/\r$//" | tmux load-buffer - && tmux paste-buffer'
    bind u run -b 'u=$(tmux capture-pane -Jp | grep -oE "https?://[^[:space:]]+" | tail -1); [ -n "$u" ] && cmd.exe /c start "" "$u"'
}

# ---- Linux desktop (no Windows interop): Wayland then X11 ------------------
if-shell '[ "$(uname -s)" = Linux ] && ! command -v clip.exe >/dev/null 2>&1' {
    bind -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null && [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -in -selection clipboard; fi'
    bind -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null && [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -in -selection clipboard; fi'
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'if command -v wl-copy >/dev/null && [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -in -selection clipboard; fi'
    bind -T root MouseDown2Pane run 'sh -c "if command -v wl-paste >/dev/null && [ -n \"$WAYLAND_DISPLAY\" ]; then wl-paste -n; else xclip -o -selection clipboard; fi" | tmux load-buffer - && tmux paste-buffer'
    bind u run -b 'u=$(tmux capture-pane -Jp | grep -oE "https?://[^[:space:]]+" | tail -1); [ -n "$u" ] && xdg-open "$u"'
}

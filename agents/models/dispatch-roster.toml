# dispatch-roster — the ONE home of the models a coordinator may dispatch work to (luna first).
#
# Every dispatch is `agent-router run --prompt-file … --cd … --sandbox …`, and Jev alone picks the
# row (AUTO PICK below); `--choice` is refused. Every row here is a candidate — there is no on/off
# switch (owner 2026-10-06: an `enabled` flag was not Tiger style; the bias toward luna is the
# price in Jev's criteria, "the cheapest row sufficient", not a hand-set weight). The route says
# how the picked row runs:
#   route = "luna"   — codex-run --choice <id> (agents/routing-control/workers/codex-run.ts): Codex is the worker's
#                      own harness. No Claude tokens.
#   route = "claude" — claude -p through agents/routing-control/workers/run-claude.ts, bounded by [claude_run].
# The Agent and Workflow tools dispatch nothing: the dispatch hook denies both and prints the table.
#
# CONFIGURATION CONTRACT (consumers, effective file, strict schema, accepted/rejected inputs):
# agents/models/dispatch-roster.contract.md.
# Read through agents/models/roster.ts by: agent-router (Jev's criteria, the worker command), the
# dispatch hook (the table on a deny), codex-run --choice (model and effort of a luna row), and
# scripts/render-home.ts (the table in the deployed ~/.claude/CLAUDE.md; `mise run doctor` fails
# when that copy is stale).
#
# NUMBERS are copied from primary pages on `as_of` and verified by an independent second reader
# (2026-10-05: 22/22 index and price values, 59/62 benchmark values confirmed; the three
# unconfirmed were per-effort luna points of a vendor chart, not used here). A number absent from
# a primary page is left out, never estimated. Refresh: re-read the pages, then edit here only.
#   aa_index   Artificial Analysis Intelligence Index v4.3.2 (artificialanalysis.ai/models/<slug>)
#   tb4        Terminal-Bench 4.0, AA's own run (agentic terminal tasks), percent
#   scicode    SciCode, AA's own run (scientific code writing), percent
#   coding_agent  AA Coding Agent Index v1.5 (DeepSWE v1.1 + SWE-Atlas-QnA + Terminal-Bench v4,
#                 run inside each vendor's agent: Codex / Claude Code); only some rows are measured
#   price_in / price_out  USD per 1M tokens, list price (OpenAI Standard short context; Anthropic
#                 base, uncached)

schema = 1
as_of = "2026-10-05"
default = "luna-high"

# AUTO PICK — `agent-router run` asks Jev one Choice question over every row (each criterion is the
# row's use_for, measured AA/TB4/SciCode, cost multiple and graded record; roster.ts criterionFor):
# the cheapest row sufficient for the brief. Jev's choice is used as made. Only with no usable answer
# (Jev unreachable, a choice outside the roster) or when the brief's cwd lies under a no_egress path
# does the `default` row run, and the reason is logged (~/.local/state/agent-router/runs.jsonl). Every key is required (owner 2026-10-05: no
# implicit default).
[auto]
max_task_chars = 6000  # the head of the brief that leaves the machine
timeout_ms = 20000
no_egress = []         # ~/… or absolute paths whose briefs never leave the machine

# Where Jev is reached. Owner 2026-10-05: the reseller (CODEFASHION TECH LTD, jevtypesafeai.com — not
# TypeSafe; states it does not store request bodies) until an official TypeSafe key exists; then
# { api = "typesafe", url = "https://api.typesafe.ai/v1/systemone", model = "jev-latest" }.
[auto.jev]
api = "reseller"
url = "https://jevtypesafeai.com/api/v1/decide"

# Bounds every claude worker runs with (agents/routing-control/workers/run-claude.ts flags), never the CLI defaults.
[claude_run]
max_budget_usd = 2.0
max_turns = 60
reason = "A worker task here cost 0.05-0.20 USD on luna; 20x is 1-4 USD, so 2 USD caps a run near the median at claude prices and turns an endless loop into a bounded failure."

[sources]
aa_models = "https://artificialanalysis.ai/models/"
aa_coding_agents = "https://artificialanalysis.ai/agents/coding-agents"
openai_pricing = "https://developers.openai.com/api/docs/pricing"
anthropic_pricing = "https://platform.claude.com/docs/en/about-claude/pricing"

[[choice]]
id = "luna-medium"
route = "luna"
model = "gpt-6-luna"
effort = "medium"
aa_index = 30
tb4 = 2.5
scicode = 50.9
price_in = 0.10
price_out = 0.50
use_for = "bulk read-only work: extraction, inventory, summaries, simple edits"


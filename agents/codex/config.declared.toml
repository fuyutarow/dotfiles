# Codex CLI configuration keys maintained by dotfiles.
# Interactive approvals use Codex's reviewer agent; sandbox boundaries stay unchanged.
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# 2026-10-09 evidence: gpt-6-luna accepted 483,584 input tokens and Codex reported a window of 828,400.
model_context_window = 1000000
model_auto_compact_token_limit = 950000

[sandbox_workspace_write]
network_access = true

[tui]
# All native Codex 0.162.1 items, in the owner's display order.
# Items without runtime data may be omitted by Codex.
status_line = [
  "project-name",
  "current-dir",
  "run-state",
  "thread-name",
  "thread-title",
  "git-branch",
  "context-remaining",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "codex-version",
  "used-tokens",
  "total-input-tokens",
  "total-output-tokens",
  "thread-credits",
  "estimated-thread-cost",
  "thread-id",
  "fast-mode",
  "model-with-reasoning",
  "reasoning",
  "task-progress",
]

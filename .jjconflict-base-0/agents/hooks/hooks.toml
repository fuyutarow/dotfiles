# Vendor-neutral hook registry — the hook analogue of agents/skills/.
#
# One source, N agent CLIs: every [[hook]] below is wired into each vendor's config by
# `mise run link:hooks` (scripts/wire-hooks.ts), which rewrites the entries it owns in
#   claude → agents/claude/settings.json  (.hooks)
#   codex  → agents/codex/hooks.json      (.hooks)
# and leaves every other entry alone. It owns exactly the hook commands that run through
# ~/.agents/hooks/run.sh (agents/hooks, linked by scripts/link-dots.sh). `mise run test` fails
# when a vendor file drifts from this registry — hand edits to an owned entry do not survive.
#
# WHAT BELONGS HERE: a hook whose whole protocol surface is shared by the vendors it lists (see
# agents/hooks/lib.ts). A hook that reads a vendor's transcript, a vendor-only tool name, or
# answers "ask" stays in that vendor's own dir (agents/claude/hooks, agents/codex/hooks).
#
# Fields: script (file in agents/hooks), event, matcher (optional), fail_closed (a policy gate
# must never fail open when bun is missing), timeout (seconds, optional), vendors.

[[hook]]
script = "enforce-storage-headroom.ts"
event = "PreToolUse"
matcher = "Bash"
fail_closed = true
vendors = ["claude", "codex"]

[[hook]]
script = "enforce-search-route.ts"
event = "PreToolUse"
matcher = "Grep|Bash"
fail_closed = true
vendors = ["claude", "codex"]

# Codex only: Claude Code enforces .claude/settings.json permissions.deny itself.
[[hook]]
script = "enforce-repo-bash-deny.ts"
event = "PreToolUse"
matcher = "Bash"
fail_closed = true
vendors = ["codex"]

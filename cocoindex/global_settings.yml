# CocoIndex Code — global settings (dotfiles-managed).
# Symlinked to ~/.cocoindex_code/global_settings.yml by scripts/link-dots.sh,
# so `ccc init` is NOT needed on a fresh machine. After editing, run `ccc doctor`.
#
# Local SentenceTransformers embeddings — fully offline, no API key (the [full] install).
#
# Model history (measured — see agents/skills/driving-cocoindex/references/catalog.md):
#   2026-07-13  Snowflake/snowflake-arctic-embed-xs → ibm-granite/granite-embedding-97m-multilingual-r2
#     Why: arctic's topical signal is EN-only (Japanese queries were topic-blind); granite-97m-r2
#     is ccc's own curated Multi-Lingual tier, code score 0.80 > arctic's 0.67, same dim (384).
#   2026-07-17  granite-97m-multilingual-r2 → granite-311m-multilingual-r2  (dim 384 → 768)
#     Why: house JA-notes+code A/B pilot — 311m-r2 beat 97m-r2 on both halves (notes and code),
#     total nDCG@10 +70%; ruri-v3-70m won notes but lost code, unfit as ccc's single global model.
#   2026-07-30  bekko-embedding-v1-a25m was swapped in and reverted the same day. The revert was
#     NOT justified: it fired on a qoed smoke miss that a later audit showed was CONFOUNDED —
#     the target `\section{適用境界}` sits in `papers/P2606_003-.../main.tex`, which qoed's own
#     settings.yml had already excluded as a demoted document in commit 7d915ed (2026-07-28),
#     two days BEFORE the test. The recorded "rank 1 @ 0.90" expectation no longer holds for the
#     incumbent either. bekko's status is UNDECIDED — neither adopted nor validly rejected.
#     Evidence and the corrected A/B: catalog.md.
#
# On any model change, run `ccc reset --force && ccc index` in EVERY registered project (the
# daemon auto-restarts on the next call). A DIMENSION change additionally needs `ccc daemon stop`
# FIRST — otherwise `ccc index` fails with "environment already open in this program" while
# `ccc reset` still succeeds, leaving an empty index (measured 2026-07-30).
#
# Registered projects are NOT only under ~/Workspace — /home/fuyu/DPP/min-sys-dpp-mvp is one.
# Enumerate before swapping; a project missed during a swap keeps a stale-dimension index.
#
# Device history:
#   2026-08-06  device unset → cpu.  With `device` unset, sentence-transformers auto-selects
#     cuda:0 ("No device provided, using cuda:0" in ~/.cocoindex_code/daemon.log), so the daemon
#     took a CUDA context, granite-311m, and a PyTorch caching allocator that never returns freed
#     blocks — on the 12 GiB RTX 3060 that competes directly with every experiment, and
#     `daemon.keep_alive_with_mcp` (default true) holds it past the 180-minute idle timeout for as
#     long as an MCP client is attached.  Search is a support tool; the GPU is the research
#     resource, so search yields it.  Safe to flip in place: same model, same 768 dims, so NO
#     `ccc reset` / reindex is required (CPU vs GPU fp32 differ far below ranking resolution).
#     Cost: query embedding moves to CPU, and a full reindex of a large project is slower.
#     Revert with `device: cuda` (or delete the key) plus `ccc daemon stop`.
#   2026-08-12  device cpu → unset. Firedancer's search index must finish promptly, and the
#     operator explicitly assigned GPU capacity to ccc indexing. Leaving the key unset keeps
#     this shared file cross-platform: SentenceTransformers selects CUDA on WSL and the local
#     accelerator on macOS. The current Firedancer index is rebuilt after this change.

embedding:
  provider: sentence-transformers
  model: ibm-granite/granite-embedding-311m-multilingual-r2
  indexing_params: {}
  query_params:
    prompt_name: query

# Environment injected into the daemon process at startup (daemon.py:649-651), which runs
# BEFORE create_embedder() and before torch is imported at all (the sentence-transformers
# import is deferred to the first _get_model() call) — so thread-count vars set here are
# honored, unlike a shell `export` against an already-running daemon, which does nothing.
#
# 2026-08-08  Added the thread/backpressure caps. Measured that day: the daemon ran 1h43m at
#   588% CPU (≈6 of 12 cores) and 4.85 GiB peak RSS indexing firedancer + dotfiles, for a
#   client that had died 1h40m earlier. Search is a support tool; it must yield. The hard
#   ceilings live in cocoindex/ccc-daemon.service.wsl — these are the in-process complement,
#   needed because PyTorch sizes its thread pool from nproc and never reads the cgroup quota.
#   Values are provisional: re-measure peak RSS after a full firedancer index and tighten.
envs:
  # PyTorch / BLAS intra-op pools. Default without these is 6 threads (torch.get_num_threads()).
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  # HuggingFace tokenizers fork their own Rayon pool per call; off is the documented default
  # for a long-lived server process.
  TOKENIZERS_PARALLELISM: "false"
  # CocoIndex engine backpressure. Default 1024 in-flight components is what drives the
  # multi-GiB heap during a large index; 64 bounds it. (Engine tokio worker threads still
  # scale with nproc and have NO env knob — CPUQuota in the unit is what bounds those.)
  COCOINDEX_MAX_INFLIGHT_COMPONENTS: "64"

# To use a cloud embedding provider via LiteLLM instead, set `provider`/`model`
# above and add keys to the `envs:` block. DO NOT commit real secrets — keep keys
# in the machine's environment and reference them.
#   OPENAI_API_KEY: ...
#   VOYAGE_API_KEY: ...

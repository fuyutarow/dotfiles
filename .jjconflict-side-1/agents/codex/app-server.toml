# Declared state of the long-lived Codex app-server daemon on this machine. The SOLE source of
# truth: agents/codex/remote-control.ts reads it, `mise run codex:remote-control` converges the
# machine to it, `mise run doctor` (codex-remote) reports drift, and the topgrade codex step
# re-converges after every update.
#
# remote_control: the ChatGPT MOBILE app reaches this machine only through the chatgpt.com relay,
# which the daemon joins only when started with remote control. The desktop app talks to the local
# socket and works either way, so a lost setting shows up as "desktop connects, mobile does not"
# (observed 2026-10-01: the 0.159.3 update restarted the daemon with remote control Disabled).
remote_control = true

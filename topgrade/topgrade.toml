# topgrade — dotfiles-managed (symlinked to ~/.config/topgrade.toml by scripts/link-dots.sh).
# Shared across mac & WSL. Step identifiers are the clap values from
# `topgrade --disable __x__` (e.g. flutter, tlmgr, claude_code, juliaup, ...).

[misc]
# Steps to skip on every run.
# gcloud: installed via mise, so `gcloud components update` is blocked by the SDK (managed-by-
# package-manager) and marks the run FAILED — mise itself updates it. Skip it. (2026-07-05)
# snap: prompts for the sudo password on every run, and buys nothing here. `snap list` on this
# host holds only core20 / core26 / snapd (snap's own runtime) plus flutter — and the flutter
# step is already disabled above, so the sudo prompt exists to refresh snapd's own plumbing.
# Refresh it by hand with `sudo snap refresh` if it ever matters. (2026-08-01)
disable = ["flutter", "tlmgr", "gcloud", "snap"]

# Keep a flaky step running but don't let its failure mark the whole run FAILED.
# (Uncomment to silence the recurring "Claude Code: FAILED" without skipping it.)
# ignore_failures = ["claude_code"]

# Custom steps — ONLY for tools topgrade cannot reach on its own. Measured 2026-07-31 before
# adding anything here, because most of the AI CLIs are already covered and duplicating them
# would just run each updater twice:
#   claude  -> native `claude_code` + `claude_code_plugins` steps, confirmed running
#   grok    -> installed as a brew CASK (`grok-build`), so `brew_cask` upgrades it
#   agy     -> a symlink to a Windows WinGet .exe; no Linux binary exists, so nothing in a
#              WSL topgrade run can update it (it belongs to `winget` on the Windows side)
#   codex   -> HAS a native step, but that step SKIPS this install. topgrade resolves the
#              binary's realpath and requires it to sit under ~/.local/bin; the standalone
#              installer puts ~/.local/bin/codex as a SYMLINK into
#              ~/.codex/packages/standalone/current/bin/, so the check fails and the step
#              reports "codex is not installed under ~/.local/bin" in the same run whose debug
#              line reads `Detected "/home/fuyu/.local/bin/codex"`. Hence this entry.
# Guarded with `command -v` because this file is shared with macOS: an absent tool must skip,
# not fail the run. The guard preserves the updater's own exit code when it IS present.
#
# `codex update` only repoints the `current` symlink to the newest downloaded release; it does
# NOT touch the long-lived `codex app-server` daemon (remote control / ChatGPT desktop
# connector), which keeps running the binary it was launched with until something restarts it.
# Measured 2026-08-23: a daemon started 2026-08-03 was still serving 0.146.0 after `current` had
# moved through 0.146.1 -> 0.147.0 -> 0.149.0 across several intervening `codex update` runs —
# `codex app-server daemon version` reports the gap as `appServerVersion` (running) vs
# `managedCodexVersion` (what `current` now points at). Restart only when they actually differ,
# so a no-op `mise up` doesn't gratuitously kill a live remote-controlled session; and preserve
# `codex update`'s own exit code as this step's status, per the guard note above.
[commands]
"Codex CLI (standalone)" = '''if command -v codex > /dev/null 2>&1; then
  codex update
  status=$?
  cur=$(codex app-server daemon version 2>/dev/null | jq -r '.appServerVersion // empty')
  want=$(codex app-server daemon version 2>/dev/null | jq -r '.managedCodexVersion // empty')
  if [ -n "$cur" ] && [ "$cur" != "$want" ]; then
    codex app-server daemon restart
  fi
  exit "$status"
else
  echo 'codex absent — skipped'
fi'''

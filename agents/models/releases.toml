# SSOT — model release dates, statuses, and retirements.
#
# WHY THIS FILE EXISTS (measured 2026-07-25): a cross-vendor design panel picked
# `gemini-3.1-pro-high` (5 months old, never GA) and `claude-opus-4-6-thinking`
# (5 months old, legacy) as its arms, because every driving-* catalog is an INVENTORY
# of what a CLI can reach and none of them recorded WHEN a model shipped. Tier names
# (`pro` > `flash`, `opus` > everything) and version numbers both fail as orderings
# across generations. A date does not fail that way — and the failure is only visible
# when all vendors sit in ONE sorted list, which no per-vendor catalog can show.
#
# THIS FILE IS THE ONLY HOME for release dates. driving-* catalogs must POINT here,
# never restate a date. `check-releases.ts` is the floor that keeps it honest:
#   mise run check:models
#
# Editing rules:
#   - `released`: what the VENDOR states. Never inferred from a version number, a
#     changelog file mtime, or memory. Unknown stays "unknown" — an empty cell is
#     information, a guessed one is a defect.
#   - `verified`: the date a human/agent last confirmed this row against `source`.
#     The floor FAILs when the newest `verified` in the file goes stale.
#   - `status`: the vendor's own word (stable / preview / legacy / deprecated / retired).
#   - `retires`: set whenever the vendor announced a shutdown/retirement date.

[meta]
# Bump this whenever any row is re-confirmed against its source.
last_full_sweep = "2026-07-25"
# The floor FAILs if today - last_full_sweep exceeds this.
max_age_days = 45
# Rows whose retirement lands within this window FAIL the floor.
retirement_warning_days = 30


# Codex CLI configuration keys maintained by dotfiles.
# Interactive approvals use Codex's reviewer agent; sandbox boundaries stay unchanged.
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# 2026-10-09 evidence: gpt-6-luna accepted 483,584 input tokens and Codex reported a window of 828,400.
model_context_window = 1000000
model_auto_compact_token_limit = 950000

[sandbox_workspace_write]
network_access = true

[tui]
# Use terminal-owned transcript rendering so Codex does not capture plain mouse drags in Herdr.
fullscreen_transcript = false
# After seeing the 12-item footer on 2026-10-11, the owner chose to keep only these four items.
# Codex 0.162.1 renders the footer on one line and clips at the right edge.
# Items without runtime data may be omitted by Codex.
status_line = [
  "thread-id",
  "model-with-reasoning",
  "current-dir",
  "run-state",
]

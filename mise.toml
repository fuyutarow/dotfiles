# Mise configuration for dotfiles management — the ONLY task runner for this repo.
# (justfile was retired; `j`/`jl` aliases remain for per-project justfiles elsewhere.)
# Single sources of truth: symlinks -> scripts/link-dots.sh, tools -> Brewfile,
# tool check -> scripts/check-tools.sh.
# 命名は wiring-mise-tasks 契約 (fmt/f fmt:check lint/l test/t up/u check/c)。この repo は
# 言語プロジェクトでなく機械設定ゆえ setup は OS 別 init に分割:
# mise-contract: waive setup -- OS-split into mac:init / wsl:init

[tasks.up]
alias = "u"
description = "Update system packages"
run = '''topgrade --disable containers || echo "Topgrade completed with some errors"'''

# ── Format / Lint ────────────────────────────────────────────────────────────
# fmt (alias f) + lint aggregate over per-language sub-tasks (<domain>:<action>),
# mirroring qoed. Markdown = rumdl (.rumdl.toml). Shell = shfmt + shellcheck for
# bash. TypeScript = biome (formatter only, 2-space pinned via CLI flags to match
# the house style — biome's own default is tabs). zsh is syntax-gated with `zsh -n`
# ONLY: shfmt's zsh dialect (v3.13+) is real but incomplete, and these zsh files are
# boot-critical config (break = no interactive shell), so we do NOT auto-format them.
# Bash file discovery is centralised via `shfmt -f <dirs>` (extension+shebang
# detection); TS via `fd -e ts -E agents/skills` (house source only — agents/skills/**
# holds vendored skill templates, excluded like it is for shfmt/rumdl). JSON/TOML are
# deliberately NOT auto-formatted: the JSON population is dominated by karabiner's
# vendored/auto-backup files and boot-critical config. `-ln bash` pins shfmt's dialect
# deterministically (and makes shfmt ignore any stray .editorconfig).

[tasks.fmt]
alias = "f"
description = "Format the repo in place: Markdown (rumdl) + bash (shfmt) + TypeScript (biome). alias: f"
depends = ["fmt:md", "fmt:sh", "fmt:ts"]

[tasks."fmt:md"]
dir = "{{config_root}}"
description = "Format Markdown with rumdl (config = .rumdl.toml: structural gate, authored docs only, agents/skills/** excluded)"
run = "rumdl fmt"

[tasks."fmt:sh"]
dir = "{{config_root}}"
description = "Format bash scripts in place with shfmt (2-space, -ci -sr -bn -s; bash dialect)"
run = '''
files="$(shfmt -f scripts tmux/scripts agents/claude lazygit .githooks)"
[ -z "$files" ] && { echo "no shell files"; exit 0; }
printf '%s\n' "$files" | xargs shfmt -w -ln bash -i 2 -ci -sr -bn -s
'''

[tasks."fmt:sh:check"]
dir = "{{config_root}}"
description = "Check bash formatting without writing (CI gate; prints diff + non-zero on drift)"
run = '''
files="$(shfmt -f scripts tmux/scripts agents/claude lazygit .githooks)"
[ -z "$files" ] && { echo "no shell files"; exit 0; }
printf '%s\n' "$files" | xargs shfmt -d -ln bash -i 2 -ci -sr -bn -s
'''

[tasks."fmt:ts"]
dir = "{{config_root}}"
description = "Format TypeScript in place with biome (house 2-space; agents/skills/** templates excluded)"
run = '''
files="$(fd -e ts -E agents/skills .)"
[ -z "$files" ] && { echo "no ts files"; exit 0; }
printf '%s\n' "$files" | xargs biome format --write --indent-style=space --indent-width=2
'''

[tasks."fmt:ts:check"]
dir = "{{config_root}}"
description = "Check TS formatting without writing (CI gate; prints diff + non-zero on drift)"
run = '''
files="$(fd -e ts -E agents/skills .)"
[ -z "$files" ] && { echo "no ts files"; exit 0; }
printf '%s\n' "$files" | xargs biome format --indent-style=space --indent-width=2
'''

# Umbrella format-check for the auto-formatted languages (Markdown check = lint:md via
# rumdl, kept there since rumdl check is a structural lint not a format-verify).
[tasks."fmt:check"]
description = "整形チェック (CI用・非破壊): bash (shfmt) + TypeScript (biome)"
depends = ["fmt:sh:check", "fmt:ts:check"]

[tasks.lint]
alias = "l"
description = "Lint the repo: Markdown (rumdl) + bash (shellcheck) + zsh (zsh -n) + skills index"
depends = ["lint:md", "lint:sh", "lint:zsh", "lint:skills-index"]

[tasks."lint:md"]
dir = "{{config_root}}"
description = "Markdown structural gate: rumdl check (render-breaking defects only; cosmetic disabled → green at adoption, catches future/AI-generated defects)"
run = "rumdl check"

[tasks."lint:sh"]
dir = "{{config_root}}"
description = "ShellCheck static analysis on bash scripts (-x follow sources; file list reused from shfmt -f)"
run = '''
files="$(shfmt -f scripts tmux/scripts agents/claude lazygit .githooks)"
[ -z "$files" ] && { echo "no shell files"; exit 0; }
printf '%s\n' "$files" | xargs shellcheck -x
'''

[tasks."lint:zsh"]
dir = "{{config_root}}"
description = "zsh syntax gate: `zsh -n` parse-only on boot-critical zsh config (MUST use the zsh binary, never bash -n)"
run = '''
rc=0
for f in zsh/aliases.zsh zsh/mac.zsh zsh/wsl.zsh \
         zsh/zshrc zsh/zshenv zsh/zprofile.mac zsh/zprofile.wsl; do
  [ -f "$f" ] || continue
  if zsh -n "$f"; then echo "✅ $f"; else echo "❌ $f"; rc=1; fi
done
exit $rc
'''

[tasks."lint:skills-index"]
dir = "{{config_root}}"
description = "Catalog completeness: every agents/skills/*/ with a SKILL.md must be linked in agents/skills/README.md"
run = '''
idx="agents/skills/README.md"
[ -f "$idx" ] || { echo "❌ missing $idx"; exit 1; }
rc=0
for d in agents/skills/*/; do
  n="$(basename "$d")"
  [ -f "$d/SKILL.md" ] || continue          # skip dangling symlinks / non-skill dirs
  if grep -q "]($n/)" "$idx"; then :; else echo "❌ not in index: $n"; rc=1; fi
done
[ "$rc" -eq 0 ] && echo "✅ skills index complete"
exit $rc
'''

[tasks.test]
alias = "t"
description = "Test the repo: Claude Code hooks (bun test). Umbrella over test:*"
depends = ["test:hooks"]

[tasks."test:hooks"]
dir = "{{config_root}}"
description = "Claude Code hook tests (bun test; each hook spawned end-to-end with synthetic payloads)"
run = "bun test agents/claude/hooks"

# CI aggregate (wiring-mise-tasks contract). lint:prose is deliberately excluded, same as
# lint.depends: dotfiles has no reports/memos to scan (they live in research repos).
[tasks.check]
alias = "c"
description = "全gate集約 (CI): fmt:check + lint + test"
depends = ["fmt:check", "lint", "test"]

# NOTE: deliberately NOT in `[tasks.lint].depends` — dotfiles has no reports/memos/
# proposals to scan (they live in research repos), so wiring it into the blocking gate
# would add friction with no target. Portable: run it against real files with `-- <paths>`.
# Machine floor = textlint presets (agents/skills/linting-prose/references/machine-floor.md); the
# hand-maintained scripts/check-prose-grounding.sh was RETIRED in the linting-prose reforge (2026-07-04).
# PREREQ (once, GLOBAL): `bun add -g textlint textlint-rule-preset-ja-technical-writing
# @textlint-ja/textlint-rule-preset-ai-writing textlint-rule-prh` — verified: after a global install
# both `bunx textlint` and `textlint` resolve the presets from ANY cwd, so no per-repo `bun add -d`.
# (CI / fresh machines need their own install; for reproducibility a repo may still `bun add -d` + lock.)
# External-register docs (外賓/社外/顧客): swap in assets/textlintrc-external.json (adds the C9 set).
[tasks."lint:prose"]
dir = "{{config_root}}"
description = "Prose lint (linting-prose machine floor): bunx textlint with the house config. Pass paths: `mise run lint:prose -- report.md docs/`. External register → textlintrc-external.json."
run = "bunx textlint --config agents/skills/linting-prose/assets/textlintrc.json"

# ── git hooks ────────────────────────────────────────────────────────────────────────────────
# 規律: .githooks/* は mise task を呼ぶだけの薄い殻にする。中身は必ずここに置く(一つの家)。
# フックは手で走らせにくく試験もしづらいが、task なら単体で走らせられ `mise tasks` に載る。
# 配線は tracked な core.hooksPath = .githooks(`git config core.hooksPath .githooks`)。
[tasks."hook:pre-commit"]
description = "git pre-commit body: run `fmt` and re-stage the formatted files that were ALREADY staged (formatting fallout in unrelated working-tree files stays unstaged). Called by .githooks/pre-commit; safe to run by hand."
run = '''
staged=$(git diff --cached --name-only --diff-filter=ACM)
echo "$staged" | grep -qE '\.(md|sh|ts)$' || exit 0   # fmt が触る拡張子だけ
mise run f > /dev/null 2>&1 || {
  echo "pre-commit: mise run f failed — fix the formatter, or bypass once with 'git commit --no-verify'" >&2
  exit 1
}
for f in $staged; do
  [ -f "$f" ] && git add "$f"
done
exit 0
'''

[tasks."hook:post-commit"]
description = "git post-commit body: warm the cocoindex index incrementally (`ccc index`) so search never pays the update latency. No-op when ccc is absent, when the repo has no .cocoindex_code/, or when the daemon is already [indexing]. Called detached by .githooks/post-commit."
run = '''
command -v ccc > /dev/null 2>&1 || exit 0
[ -d "$(git rev-parse --show-toplevel)/.cocoindex_code" ] || exit 0   # 索引していない repo では黙って抜ける
ccc daemon status 2> /dev/null | grep -q "\\[indexing\\]" && exit 0    # 走行中なら間引く
ccc index > /dev/null 2>&1 || true
exit 0
'''

[tasks."hook:post-merge"]
description = "git post-merge body: after a pull/merge, relink dotfiles (link-dots.sh, SAFE mode) then relink skills, so newly-pulled config appears with no manual step. Idempotent. Called by .githooks/post-merge."
run = '''
bash "${DOTFILES:-$HOME/dotfiles}/scripts/link-dots.sh" || true
exec mise run link:skills
'''

[tasks."cache:clean"]
description = "Reclaim disk: clear package-manager GLOBAL caches (brew/bun/npm/pnpm/yarn/uv/pip/go/docker/cargo). Safe — only regenerable caches; topgrade --cleanup misses bun, this covers it."
run = '''
echo "before: $(df -h "$HOME" | awk 'NR==2{print $4" free"}')"

command -v brew   >/dev/null 2>&1 && { echo "• brew cleanup --prune=all";  brew cleanup --prune=all || true; }

# bun: native `bun pm cache rm` frees the space immediately, but errors outside a project
# (oven-sh/bun #16101/#18733) — so run it inside an ephemeral package.json dir.
if command -v bun >/dev/null 2>&1; then
  echo "• bun pm cache rm"
  _bt="$(mktemp -d)" && printf '{}' > "$_bt/package.json" && ( cd "$_bt" && bun pm cache rm ) || true
  command -v rip >/dev/null 2>&1 && rip "$_bt" 2>/dev/null || rm -rf "$_bt"
fi

command -v npm    >/dev/null 2>&1 && { echo "• npm cache clean";      npm cache clean --force || true; }
command -v pnpm   >/dev/null 2>&1 && { echo "• pnpm store prune";     pnpm store prune || true; }
command -v yarn   >/dev/null 2>&1 && { echo "• yarn cache clean";     yarn cache clean || true; }  # Berry global: add --all
# uv: `uv cache clean/prune` BLOCKS on the cache lock while ANY uv process runs — e.g. the
# uvx-launched MCP servers during an AI session. Skip when uv/uvx is active so the task never hangs
# (the [u] in the pattern stops pgrep from matching this script's own command line).
if command -v uv >/dev/null 2>&1; then
  if pgrep -f '[u]v tool|[u]vx' >/dev/null 2>&1; then
    echo "• uv cache prune — skipped (uv/uvx active; would block on the cache lock)"
  else
    echo "• uv cache prune"; uv cache prune || true
  fi
fi
command -v pip    >/dev/null 2>&1 && { echo "• pip cache purge";      pip cache purge || true; }
command -v go     >/dev/null 2>&1 && { echo "• go clean -cache";      go clean -cache || true; }
command -v docker >/dev/null 2>&1 && { echo "• docker builder prune"; docker builder prune -f 2>/dev/null || true; }

# cargo: no built-in cache cleaner on stable (cargo-cache is external; `cargo clean gc` is nightly-only).
# Rust 1.88+ auto-GCs stale entries; this rips the regenerable download caches (recoverable via rip's graveyard).
if command -v cargo >/dev/null 2>&1 && command -v rip >/dev/null 2>&1; then
  echo "• cargo registry/git caches (rip → graveyard)"
  rip "$HOME"/.cargo/registry/src "$HOME"/.cargo/registry/cache "$HOME"/.cargo/git/checkouts 2>/dev/null || true
fi

echo "after:  $(df -h "$HOME" | awk 'NR==2{print $4" free"}')"
echo "✅ cache:clean done. Project build artifacts (node_modules/target/…) → mise run cache:projects"
'''

[tasks."cache:projects"]
description = "Clean project build artifacts (node_modules/target/build…) via kondo — interactive, scoped to projects untouched ≥30d. Set KONDO_DIR / KONDO_OLDER to override."
run = 'kondo --older "${KONDO_OLDER:-30d}" ${KONDO_DIR:-$HOME}'

# --- the 断捨離 pass, split by WHO MAY DECIDE ------------------------------------------------
#   cache:clean   no judgment needed (regenerable package caches)   → any agent, run blind
#   cache:audit   evidence only, deletes NOTHING                    → any agent, run blind
#   (rip)         accept a candidate — reversible, same-fs rename   → any agent, no space freed yet
#   cache:purge   empty the graveyard — THE irreversible step       → human only
# The gate sits on the ONE irreversible action, not on the delete. That is what makes the rest
# delegatable: an agent working from cache:audit physically cannot lose data.
[tasks."cache:audit"]
description = "READ-ONLY 断捨離 evidence: stale dotdirs, rustup toolchains (with a pin search), vscode-server versions, and the ~/.cache breakdown — each with size, last-touched date and age. Deletes nothing; hand the table to whoever decides. STALE_DAYS=180 to retune."
run = '''
stale_days="${STALE_DAYS:-180}"
now=$(date +%s)

_mtime() { stat -c %Y "$1" 2> /dev/null || stat -f %m "$1" 2> /dev/null; }   # GNU then BSD
_when() { # → "2026-02-25 (148d)"
  m=$(_mtime "$1") || return 0
  printf '%s (%dd)' "$(date -d "@$m" +%F 2> /dev/null || date -r "$m" +%F)" "$(((now - m) / 86400))"
}

echo "== 1. ~/ の隠しディレクトリ: 最終更新が ${stale_days} 日以上前 =="
for d in "$HOME"/.[!.]*/; do
  d="${d%/}"; m=$(_mtime "$d") || continue
  [ $(((now - m) / 86400)) -ge "$stale_days" ] || continue
  printf '  %-8s %-28s %s\n' "$(du -sh "$d" 2> /dev/null | cut -f1)" "~/${d##*/}" "$(_when "$d")"
done
echo "  (サイズは候補のみ計測。年齢は手掛かりであって証拠ではない — 親の mtime は中身の"
echo "   更新を反映しないので ~/.local や ~/.rustup のような現役も並ぶ。§2〜§4 で裏を取れ)"

echo
echo "== 2. rustup toolchain: 既定と、プロジェクトによる固定の有無 =="
if command -v rustup > /dev/null 2>&1; then
  rustup toolchain list | sed 's/^/  /'
  echo "  -- rust-toolchain で固定しているプロジェクト --"
  if command -v fd > /dev/null 2>&1; then
    fd -H -t f "^rust-toolchain(\\.toml)?$" "${AUDIT_PROJECTS:-$HOME/Workspace}" 2> /dev/null |
      while read -r f; do printf '  %s → %s\n' "$f" "$(grep -h channel "$f" 2> /dev/null | tr -d ' ')"; done
    echo "  (この一覧が空なら、既定以外の toolchain を固定しているものは無い)"
  else
    echo "  fd 不在のため未検索"
  fi
fi

echo
echo "== 3. vscode-server: 現行版以外は再接続で取り直される =="
s="$HOME/.vscode-server/cli/servers"
[ -d "$s" ] && for v in "$s"/Stable-*; do
  [ -e "$v" ] || continue
  printf '  %-8s %-46s %s\n' "$(du -sh "$v" 2> /dev/null | cut -f1)" "${v##*/}" "$(_when "$v")"
done

echo
echo "== 4. ~/.cache 内訳(降順) =="
du -sh "$HOME"/.cache/* 2> /dev/null | sort -rh | head -12 | sed "s|$HOME|~|" | sed 's/^/  /'

echo
echo "== 5. graveyard(rip 済み・まだ空きは増えていない) =="
for g in "${GRAVEYARD:-/tmp/graveyard-$USER}" "/tmp/graveyard-$USER"; do
  [ -d "$g" ] && { printf '  %s  %s\n' "$(du -sh "$g" 2> /dev/null | cut -f1)" "$g"; break; }
done
echo
echo "df: $(df -h "$HOME" | awk 'NR==2{print $4" free / "$2}')"
echo "→ 判断が要らない分は cache:clean / 受け入れた候補は rip / 空きが増えるのは cache:purge だけ"
'''

[tasks."cache:purge"]
description = "IRREVERSIBLE: empty rip's graveyard. This is the ONLY step that actually frees disk — rip is a same-filesystem rename, so ripped data still occupies space until purged. Prints the contents and requires typing 'yes'. Human-only gate; never run this from an agent."
run = '''
g="${GRAVEYARD:-/tmp/graveyard-$USER}"
[ -d "$g" ] || { echo "graveyard 無し: $g"; exit 0; }
echo "== $g の中身 =="
du -sh "$g"/* 2> /dev/null | sort -rh | head -20
echo
echo "合計 $(du -sh "$g" 2> /dev/null | cut -f1) — これを完全に削除します。復元はできません。"
printf "続けるなら yes と入力: "
read -r ans
[ "$ans" = "yes" ] || { echo "中止しました。"; exit 1; }
find "$g" -mindepth 1 -maxdepth 1 -exec /bin/rm -rf -- {} +   # 絶対パスで shell の rm 無効化を回避
echo "✅ purge 完了。 $(df -h "$HOME" | awk 'NR==2{print $4" free"}')"
'''

[tasks."install:tools"]
description = "Install the full CLI toolbox (single source: Brewfile)"
run = 'brew bundle --file=~/dotfiles/Brewfile'

[tasks."install:bun_packages"]
run = '''
bun i -g @anthropic/claude-code @openapi/doex @google/gemini-cli
'''

[tasks."mac:init"]
description = "Initialize Mac environment (all-in-one setup)"
run = '''
brew install sheldon coreutils
brew bundle --file=~/dotfiles/Brewfile
mise run link:dots
mise run link:skills
mise run tmux:plugins
echo "---"
echo "Setup complete. Run: exec zsh"
'''

[tasks."link:dots"]
description = "Create dotfile symlinks (OS-aware; single source: scripts/link-dots.sh)"
run = 'bash ~/dotfiles/scripts/link-dots.sh --force'

[tasks."tmux:plugins"]
description = "Install tmux plugins via TPM (non-interactive; run after link-dots)"
run = '''
TPM_DIR="$HOME/.tmux/plugins/tpm"
[ -d "$TPM_DIR/.git" ] || git clone --depth 1 https://github.com/tmux-plugins/tpm "$TPM_DIR"
"$TPM_DIR/bin/install_plugins"
'''

[tasks."check:tools"]
description = "Check recommended tools (single source: scripts/check-tools.sh; install via Brewfile)"
run = 'bash ~/dotfiles/scripts/check-tools.sh'

[tasks."check:models"]
description = "Model-release SSOT floor (agents/models/releases.toml): staleness, retirements, dead refs"
run = 'bun ~/dotfiles/agents/models/check-releases.ts'

[tasks."wsl:init"]
description = "Initialize WSL environment (after: install linuxbrew, brew install mise)"
run = '''
sudo apt install -y zsh
brew install sheldon topgrade
bash ~/dotfiles/scripts/link-dots.sh --force
brew bundle --file=~/dotfiles/Brewfile
mise run tmux:plugins
topgrade
chsh -s $(which zsh)
echo "---"
echo "Setup complete. Run: exec zsh"
'''

[tasks."wsl:fix-gitexe"]
description = "Allow Windows git.exe to trust the WSL repo path"
# Derive the UNC path (wslpath knows the distro AND the user); the old literal baked in a stale
# distro (Ubuntu-22.04) and the WINDOWS username as if it were the Linux one — wrong on both axes.
run = '''
command -v git.exe >/dev/null 2>&1 || { echo "git.exe not on PATH (Windows git not installed?)"; exit 1; }
unc=$(wslpath -w "$PWD" | tr '\\' '/')   # \\wsl.localhost\<distro>\home\<user>\dotfiles → //…
git.exe config --global --add safe.directory "%(prefix)/$unc"
echo "trusted: %(prefix)/$unc"
'''

[tasks."install:rust"]
description = "Install Rust toolchain"
run = 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh'

[tasks."cc:install-mcp"]
description = "Apply .mcp.json (single declarative source) to Claude Code (user scope) AND Codex. Idempotent. mac & WSL."
run = '''
set -eu
MCP_JSON="${DOTFILES:-$HOME/dotfiles}/.mcp.json"
# cocoindex-code's MCP server is the binary `ccc` (a separate uv tool); ensure it exists.
# [full] = local SentenceTransformer embeddings, no API key.
command -v ccc >/dev/null 2>&1 || uv tool install --upgrade 'cocoindex-code[full]'

# SINGLE SOURCE OF TRUTH = .mcp.json. Read each server and register into BOTH tools
# (Claude user scope -> ~/.claude.json ; Codex -> ~/.codex/config.toml), idempotently.
# Formats differ (Claude JSON / Codex TOML) so each tool's own `mcp add` CLI applies it.
# Two kinds: remote (type http/sse -> has .url) and local stdio (.command + .args).
# stdio args are space-free tokens by construction, so word-splitting $cmd $args is safe.
for name in $(jq -r '.mcpServers | keys[]' "$MCP_JSON"); do
  type=$(jq -r --arg n "$name" '.mcpServers[$n].type // "stdio"' "$MCP_JSON")
  url=$(jq -r --arg n "$name" '.mcpServers[$n].url // ""' "$MCP_JSON")
  cmd=$(jq -r --arg n "$name" '.mcpServers[$n].command // ""' "$MCP_JSON")
  args=$(jq -r --arg n "$name" '.mcpServers[$n].args // [] | join(" ")' "$MCP_JSON")
  claude mcp remove -s user "$name" 2>/dev/null || true
  if [ -n "$url" ]; then
    claude mcp add -s user --transport "$type" "$name" "$url"      # remote http/sse
  else
    claude mcp add -s user "$name" -- $cmd $args                   # local stdio
  fi
  if command -v codex >/dev/null 2>&1; then
    codex mcp remove "$name" 2>/dev/null || true
    if [ -n "$url" ]; then codex mcp add "$name" --url "$url"; else codex mcp add "$name" -- $cmd $args; fi
  fi
  echo "registered: $name (${url:-$cmd $args})"
done
echo "applied $MCP_JSON -> Claude(user) + Codex"

# DRIFT REPORT (added 2026-07-25). The loop above only visits names PRESENT in .mcp.json,
# so deleting an entry here never uninstalls it — measured: cocoindex-code stayed live and
# connected long after it was removed from this file, and a session kept trying to use it.
# Every other declarative home in this repo prunes (link-dots.sh, link:skills); this one did
# not. Reporting is the default because the live set has drifted far past this file, and a
# blind prune would uninstall servers nobody declared here. Opt in with MCP_PRUNE=1.
declared=$(jq -r '.mcpServers | keys[]' "$MCP_JSON" | sort)
live=$(claude mcp list 2>/dev/null | sed -n 's/^\([a-zA-Z0-9_-]*\): .*/\1/p' | sort)
undeclared=$(comm -13 <(echo "$declared") <(echo "$live") || true)
if [ -n "${undeclared:-}" ]; then
  echo "--- DRIFT: registered but NOT declared in .mcp.json ---"
  echo "$undeclared" | sed 's/^/  /'
  if [ "${MCP_PRUNE:-0}" = "1" ]; then
    for name in $undeclared; do
      claude mcp remove -s user "$name" 2>/dev/null || true
      command -v codex >/dev/null 2>&1 && codex mcp remove "$name" 2>/dev/null || true
      echo "  pruned: $name"
    done
  else
    echo "  (declare them in .mcp.json, or re-run with MCP_PRUNE=1 to uninstall them)"
    echo "  NOTE: .mcp.json is documented as the single source of truth; this list is the gap."
  fi
fi
echo "tip: run 'ccc index <repo>' once to warm cocoindex-code's embedding model."
'''

[tasks."link:skills"]
description = "Link agents/ commands and skills into AI tools' config directories"
run = '''
DOTFILES="${DOTFILES:-$HOME/dotfiles}"

# Activate the post-merge hook so future `git pull`s auto-relink skills (OS-agnostic;
# every setup runs this task). Idempotent. See .githooks/post-merge.
git -C "$DOTFILES" config core.hooksPath .githooks 2>/dev/null || true

link_path() {
  src="$1"
  dst="$2"
  if [ ! -e "$src" ]; then
    echo "skip (missing): $src"
    return 0
  fi
  mkdir -p "$(dirname "$dst")"
  if [ -L "$dst" ] || [ ! -e "$dst" ]; then
    ln -sfn "$src" "$dst"
    echo "linked: $dst -> $src"
  else
    echo "skip (exists, not symlink): $dst"
  fi
}

# Claude Code — slash commands
mkdir -p ~/.claude
link_path "$DOTFILES/agents/commands" ~/.claude/commands

# Claude Code — skills: link each skill INDIVIDUALLY. Claude Code itself
# populates ~/.claude/skills/ with plugin-installed skills (real dirs), so a
# whole-dir symlink would either clobber them or silently nest. Per-skill
# links coexist with plugin skills.
if [ -L ~/.claude/skills ]; then
  old_target="$(readlink ~/.claude/skills)"
  unlink ~/.claude/skills
  echo "removed whole-dir symlink: ~/.claude/skills -> $old_target"
fi
mkdir -p ~/.claude/skills
if [ -d "$DOTFILES/agents/skills" ]; then
  for skill in "$DOTFILES"/agents/skills/*/; do
    [ -d "$skill" ] || continue
    name="$(basename "$skill")"
    # `driving-claude` is deliberately Codex-only: it teaches Codex to drive this
    # CLI, so exposing it as a Claude Code skill would be self-referential and
    # creates a needless trigger collision. Codex receives the whole source tree
    # through ~/.agents/skills below.
    if [ "$name" = "driving-claude" ]; then
      dst="$HOME/.claude/skills/$name"
      if [ -L "$dst" ] && [ "$(readlink "$dst")" = "$DOTFILES/agents/skills/$name" ]; then
        unlink "$dst"
        echo "excluded (Codex-only): $dst"
      else
        echo "excluded (Codex-only): $dst"
      fi
      continue
    fi
    link_path "${skill%/}" ~/.claude/skills/"$name"
  done
  # Prune renamed/deleted skills: this loop only ADDS, so a rename (transcribe-media →
  # transcribing-media) leaves the old link dangling and Claude keeps listing a skill that is
  # gone. Remove only dangling links INTO this repo; plugin skills (real dirs) are untouched.
  for old in ~/.claude/skills/*; do
    [ -L "$old" ] || continue
    [ -e "$old" ] && continue
    case "$(readlink "$old")" in
      "$DOTFILES"/*) rm -f "$old" && echo "pruned (renamed/deleted): $old" ;;
    esac
  done
else
  echo "skip (missing): $DOTFILES/agents/skills"
fi

# Codex — global guidance, skills, and legacy markdown prompts
mkdir -p ~/.codex
mkdir -p ~/.agents
link_path "$DOTFILES/agents/codex/AGENTS.md" ~/.codex/AGENTS.md
link_path "$DOTFILES/agents/skills"          ~/.agents/skills
link_path "$DOTFILES/agents/commands"        ~/.codex/prompts
if [ -L ~/.codex/skills ] && [ "$(readlink ~/.codex/skills)" = "$DOTFILES/agents/commands" ]; then
  unlink ~/.codex/skills
  echo "removed stale: ~/.codex/skills -> $DOTFILES/agents/commands"
fi

# Gemini — global_workflows
mkdir -p ~/.gemini/antigravity
link_path "$DOTFILES/agents/commands" ~/.gemini/antigravity/global_workflows

echo "✅ Agent link pass complete. Source root: $DOTFILES"
'''

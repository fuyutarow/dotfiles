# Owner declarations received 2026-10-16. Gates run only in an export of committed trunk.
# checked counts consumers selected by changed surface, including copy/setup failures.
# Omitted trunk uses the consumer repository's own trunk() revset.
[[consumers]]
name = "retrospectives"
root = "/home/fuyu/Workspace/retrospectives"
trunk = "alpha"
surfaces = ["presets/typescript"]
setup = ["mise", "run", "setup"]
# Coordinator: hook:pre-commit depends only on lint = lint:records + lint:ts.
command = ["mise", "run", "lint"]
timeout_ms = 120000

[[consumers]]
name = "firedancer"
root = "/home/fuyu/Workspace/firedancer"
trunk = "alpha"
surfaces = ["presets/typescript"]
setup = ["bun", "install", "--frozen-lockfile"]
# Coordinator: retain the policy drift check here even when it moves to check.
command = ["sh", "-c", "mise run lint:ts && mise run lint:oxlint-policy"]
timeout_ms = 120000

[[pending]]
reason = "The declared gate cannot run under the consumer sandbox: agent-resource-run cannot reach the user systemd cgroup bus."
name = "polysearch-v1"
root = "/home/fuyu/Workspace/polysearch-v1"
surfaces = ["package-bins"]
bins = ["agent-resource-run", "jj-commit"]
setup = ["sh", "-c", "mise trust && cargo fetch --locked"]
command = ["sh", "-c", "agent-resource-run --manifest .agents/resources/w-integ.resource.json --job-id consumer-check -- true && jj-commit --help >/dev/null"]
full_gate_rule = "The owner runs the full gate only when agent-resource-run CLI or manifest schema changes."
timeout_ms = 120000

[[consumers]]
name = "coralbase"
root = "/home/fuyu/Workspace/coralbase"
trunk = "alpha"
surfaces = ["package-bins"]
bins = ["fmt-staged", "mise-contract", "jj-commit", "jj-push"]
setup = ["mise", "run", "setup"]
# Coordinator: cheap gate; full hook:pre-commit = fmt:staged + lint needs a path argument.
# Add presets/typescript only after coralbase runs preset sync.
command = ["mise", "run", "lint"]
timeout_ms = 120000

# Runner policy. One GPU job scope at a time, including its surviving children.
# This counts jobs across the host, not devices, processes, or existing slot files.
schema = 1
gpu_max_concurrent_jobs = 1

# Compatibility capacity declarations: firedancer envs/jq/jq_capacity.py reads these.
# The thin runner does not reserve or aggregate these resources.
min_host_ram_safety_gib = 4
host_ram_safety_fraction = 0.1
gpu_safety_mib = 512

# Resident services and jq_capacity.py retain their partition declarations.
# gpu_partition.py and cocoindex/ccc-daemon-launch.py are independent consumers.
gpu_partition_device = 0
gpu_partition_ccc_mib = 2048
gpu_partition_rerank_mib = 2048

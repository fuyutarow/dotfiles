# Codex CLI configuration keys maintained by dotfiles.
# Interactive approvals use Codex's reviewer agent; sandbox boundaries stay unchanged.
approval_policy = "never"
approvals_reviewer = "auto_review"

# 2026-10-09 evidence: gpt-6-luna accepted 483,584 input tokens and Codex reported a window of 828,400.
model_context_window = 1000000
model_auto_compact_token_limit = 500000

[sandbox_workspace_write]
network_access = true

[tui]
# User-requested fullscreen transcript with the composer fixed at the bottom.
fullscreen_transcript = true
# After seeing the 12-item footer on 2026-10-11, the owner chose to keep only these four items.
# Codex 0.162.1 renders the footer on one line and clips at the right edge.
# Items without runtime data may be omitted by Codex.
status_line = [
  "thread-id",
  "model-with-reasoning",
  "current-dir",
  "run-state",
]

# Codex-only keys layered onto servers declared in .mcp.json (which Claude Code also reads, so
# these cannot live there). Values follow what `reason-network setup` writes for Codex
# (reason-network src/setup.rs codex(), commit e4b8d50e): the daemon registers a session under
# its agent name and home; check_inbox(wait_secs) long-polls need room beyond Codex's default
# tool timeout; and approval policy `never` otherwise refuses every call with "MCP tool call
# requires approval". The approve mode is set for this one server only.
# ${HOME} in env values is the machine's home, substituted when the declaration is read.
[mcp_servers.reason-network]
tool_timeout_sec = 660
default_tools_approval_mode = "approve"

# REASON_NETWORK_HOME names the state directory; leave it unset to use ~/.reason/network.
# Upstream setup's $HOME value is wrong here because it points at the whole machine home.
[mcp_servers.reason-network.env]
REASON_NETWORK_AGENT = "codex"
